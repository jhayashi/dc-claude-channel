<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="webxdc.js"></script>
<style>
:root {
  --bg:        #0B0F17;
  --surface:   #131826;
  --surface-2: #1A2030;
  --surface-3: #232A3C;
  --line:      #2C3447;
  --line-soft: #1F2536;
  --ink:       #E8ECF5;
  --ink-mute:  #99A2B8;
  --ink-faint: #6C748A;
  --paper:     #FAF9F5;
  --orange:    #D97757;
  --green:     #3DA85A;
  --amber:     #C99A35;
  --danger:    #E5694C;
  --orange-soft: rgba(217,119,87,0.14);
  --danger-soft: rgba(229,105,76,0.14);
  --radius:    14px;
  --radius-sm: 10px;
  --font-sans: ui-sans-serif, system-ui, -apple-system, Inter, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink-mute);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.sidebar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--line-soft);
  padding: 8px 8px 0;
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
/* Inner horizontal scroller for doc-tabs. Sibling .kebab-btn sits outside
   this element so it stays pinned to the right edge even when tabs overflow
   (issue #99). min-width:0 lets the flex item actually shrink below its
   content's intrinsic width so the kebab is never pushed off. */
.sidebar-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex: 1 1 auto;
  min-width: 0;
}
.doc-tab {
  position: relative;
  padding: 8px 10px 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  color: var(--ink-faint);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
}
.doc-tab.active {
  background: var(--bg);
  color: var(--ink);
  font-weight: 500;
}
.doc-tab.active::after {
  content: '';
  position: absolute;
  left: 12px; right: 12px; bottom: 0;
  height: 2px;
  background: var(--orange);
  border-radius: 1px;
}
.doc-tab .tab-title {
  display: inline-block;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.doc-tab .tab-close {
  width: 16px;
  height: 16px;
  display: inline-grid;
  place-items: center;
  color: var(--ink-faint);
  flex-shrink: 0;
  cursor: pointer;
  transition: color 120ms ease;
}
.doc-tab .tab-close svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.doc-tab .tab-close:hover, .doc-tab .tab-close:active {
  color: var(--danger);
}
/* #78: export-as-attachment lived as its own button at the right edge
   of the sidebar; replaced by the kebab menu (see below). Action is
   now a menu item; while pending, the export-toast under the sidebar
   provides feedback. No standalone button styles required anymore. */
@keyframes exportspin { to { transform: rotate(360deg); } }
/* Toast under the sidebar — success (green) or error (danger). */
.export-toast {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 500;
  border-bottom: 1px solid var(--line-soft);
  animation: exporttoast 180ms ease;
  position: sticky;
  top: 36px;  /* below the sticky sidebar */
  z-index: 9;
}
.export-toast.success { background: var(--green-soft); color: var(--green); }
.export-toast.error   { background: var(--danger-soft); color: var(--danger); }
.export-toast .dot {
  width: 14px;
  height: 14px;
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
}
@keyframes exporttoast {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
/* #77/#78 follow-up: kebab menu replaces individual find + export buttons.
   Frees up horizontal space in the tab strip for the actual file tabs.
   Single ⋮ button pinned right; tap opens a popover with menu items.
   Tapping outside or pressing Esc closes the menu. */
.sidebar .kebab-btn {
  margin-bottom: -1px;
  padding: 8px 12px 10px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--ink-faint);
  font-family: inherit;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  border-radius: 10px 10px 0 0;
  flex-shrink: 0;
  transition: background 120ms ease, color 120ms ease;
}
.sidebar .kebab-btn:hover { background: var(--surface-2); color: var(--ink); }
.sidebar .kebab-btn:active { opacity: 0.7; }
.sidebar .kebab-btn[aria-expanded="true"] {
  background: var(--surface-2);
  color: var(--ink);
}

/* The popover itself. Anchored to bottom-right of the kebab button via
   inline positioning set by openKebabMenu. position:fixed so it escapes
   the sidebar's overflow clipping. */
#kebab-menu {
  display: none;
  position: fixed;
  z-index: 50;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  min-width: 200px;
  padding: 6px;
  animation: kebabFade 120ms ease;
}
#kebab-menu.visible { display: block; }
@keyframes kebabFade {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
#kebab-menu .kebab-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: background 100ms ease;
}
#kebab-menu .kebab-item:hover { background: var(--surface-2); }
#kebab-menu .kebab-item:active { opacity: 0.7; }
#kebab-menu .kebab-item-icon {
  font-size: 14px;
  flex-shrink: 0;
  min-width: 18px;
  text-align: center;
}
#kebab-menu .kebab-item-label { flex: 1 1 auto; }
#kebab-menu .kebab-item-kbd {
  font-size: 10px;
  color: var(--ink-faint);
  padding: 2px 5px;
  background: var(--surface-3);
  border: 1px solid var(--line);
  border-radius: 3px;
  font-family: var(--font-mono);
  flex-shrink: 0;
}

/* #77: search bar that replaces the sidebar at the top when active. */
#search-bar {
  display: none;
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--line-soft);
  padding: 8px 10px;
  align-items: center;
  gap: 8px;
}
body.searching #search-bar { display: flex; }
body.searching .sidebar { display: none; }
#search-bar input {
  flex: 1 1 auto;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  outline: none;
}
#search-bar input:focus { border-color: var(--orange); }
#search-bar .search-counter {
  font-size: 11px;
  color: var(--ink-faint);
  min-width: 44px;
  text-align: right;
  flex-shrink: 0;
}
#search-bar .search-counter.no-matches { color: var(--danger); }
#search-bar button {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 14px;
  color: var(--ink-mute);
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
  transition: background 120ms ease, color 120ms ease;
}
#search-bar button:hover { background: var(--surface-2); color: var(--ink); }
#search-bar button[disabled] { opacity: 0.4; cursor: default; }

/* match highlight on the rendered content */
.search-match {
  background: var(--amber);
  color: var(--bg);
  border-radius: 2px;
  padding: 0 1px;
}
.search-match.current {
  outline: 2px solid var(--orange);
  outline-offset: 1px;
}
/* source-mode: extra gutter indicator on lines that contain a match */
.source-line.has-search-match .line-gutter::after {
  content: '';
  position: absolute;
  right: 2px;
  top: 50%;
  transform: translateY(-50%);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--orange);
}
.source-line .line-gutter { position: relative; }

/* Confirm dialog */
.dialog-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.dialog-overlay.visible { display: flex; }
.dialog {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  max-width: 320px;
  width: 100%;
  color: var(--ink);
}
.dialog-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
.dialog-body { font-size: 13px; color: var(--ink-mute); margin-bottom: 16px; word-break: break-word; line-height: 1.5; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
.dialog-btn {
  padding: 8px 14px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}
.dialog-btn.cancel {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.dialog-btn.cancel:hover { border-color: color-mix(in oklch, var(--ink) 25%, var(--line)); }
.dialog-btn.confirm {
  background: var(--surface-2);
  color: var(--ink-mute);
  border-color: var(--line);
}
.dialog-btn.confirm:hover {
  color: var(--danger);
  border-color: color-mix(in oklch, var(--danger) 40%, var(--line));
}
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 60px 36px;
  line-height: 1.6;
}
/* Source view gets a tighter wrapper — the gutter + source-line padding
   already provide enough left whitespace. */
.content.source-mode {
  padding: 0 0 60px 0;
}
/* Markdown rendered styles */
.content h1 { font-size: 24px; font-weight: 700; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); color: var(--ink); }
.content h2 { font-size: 20px; font-weight: 600; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); color: var(--ink); }
.content h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; color: var(--ink); }
.content p { margin: 0 0 12px; color: var(--ink-mute); }
.content ul, .content ol { margin: 0 0 12px; padding-left: 24px; color: var(--ink-mute); }
.content li { margin: 4px 0; }
.content code {
  font-family: var(--font-mono);
  background: var(--surface-3);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
  font-size: 13px;
  color: var(--ink);
}
.content pre {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin: 0 0 12px;
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.5;
}
.content pre code { display: block; background: none; border: none; padding: 0; }
.content blockquote {
  border-left: 2px solid var(--orange);
  padding: 4px 16px;
  margin: 0 0 12px;
  color: var(--ink-mute);
  font-style: italic;
}
.content a {
  color: var(--orange);
  text-decoration: none;
  border-bottom: 1px dashed color-mix(in oklch, var(--orange) 55%, transparent);
}
.content hr { border: none; border-top: 1px solid var(--line-soft); margin: 16px 0; }
.content strong { color: var(--ink); }
.content em { color: var(--ink); }
.content table { border-collapse: collapse; margin: 0 0 12px; width: 100%; }
.content th, .content td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
.content th { background: var(--surface-2); font-weight: 600; color: var(--ink); }
.content del { color: var(--ink-faint); text-decoration: line-through; }
.content ol { padding-left: 24px; margin: 0 0 12px; }
.content ul { padding-left: 24px; margin: 0 0 12px; }
.content li { margin: 2px 0; }
.content li.task { list-style: none; margin-left: -20px; }
.content li.task .task-mark {
  display: inline-block;
  width: 22px;
  margin-right: 6px;
  font-size: 18px;
  vertical-align: middle;
}
.content li.task.done { color: var(--ink-faint); }
/* #75: suppress native long-press behaviors (iOS callout/selection
   magnifier, Android selection) on commentable elements, and give list
   items a usable hit-target size. The CSS is the actual cure for native
   gesture conflicts — sync preventDefault in attachLongPress is only
   defense-in-depth. touch-action: pan-y keeps vertical scroll working
   when the user's finger lands on a commentable bullet. */
.content li[data-paragraph],
.content tr[data-paragraph],
.content .code-line[data-paragraph],
.md-block[data-paragraph] {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: pan-y;
}
/* #75 follow-up (#77 surfaced it): the user-select / touch-callout
   rules above don't always cascade to descendants in WebKit when the
   parent uses display: flex. A loose-list bullet renders as:
     <li display:flex>
       <span class="bullet">•</span>
       <p>... bullet text ...</p>          <-- WebKit: <p> ignores parent's none
     </li>
   The <p> falls back to its user-agent default (user-select: text),
   selection works again on bullet text, iOS's selection magnifier wins
   over our long-press, comment gesture loses. #77's <mark.search-match>
   wrappers inherit the same broken cascade. Explicit rule on descendants
   forces the property through. */
.content li[data-paragraph] *,
.content tr[data-paragraph] *,
.content .code-line[data-paragraph] *,
.md-block[data-paragraph] * {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.content li[data-paragraph] {
  min-height: 36px;
  padding: 6px 0;
}
/* #75: custom bullet rendering for top-level lists with commentable items.
   Native ::marker pseudo-elements aren't in the <li>'s hit-test box, so
   tapping the visible bullet falls through to the <ul> and bubbles up
   to surrounding blocks. Custom .bullet spans are inside the <li>, so
   bullet taps register correctly. */
.content .md-list-custom {
  list-style: none;
  padding-left: 0;
}
.content .md-list-custom > li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.content .md-list-custom > li > .bullet {
  flex: 0 0 auto;
  min-width: 16px;
  color: var(--ink-faint);
  user-select: none;
  padding-top: 6px;  /* match the li padding so bullet aligns with text */
}
/* The hand-rolled renderer emits <li>s with inline children only (no <p>
   wrap). Combined with the flex layout above, each inline child became
   its own flex item — for `* **[long link](url)** — long tail`, the
   trailing text won flex space and the <strong> shrank to min-content,
   collapsing the link into a one-word-per-line column. Wrapping
   post-bullet children in a single .li-content keeps the whole body
   as one flex item; min-width:0 lets normal inline wrapping happen. */
.content .md-list-custom > li > .li-content {
  flex: 1 1 auto;
  min-width: 0;
}
.content h4 { font-size: 16px; margin: 16px 0 8px; color: var(--ink); }
.content h5 { font-size: 14px; margin: 14px 0 6px; color: var(--ink); }
.content h6 { font-size: 13px; margin: 12px 0 6px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
/* Source view styles */
.source-view {
  padding: 0;
  overflow-x: auto;
}
.source-view pre {
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  border-radius: 0;
}
.source-view code {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.5;
  background: none;
  border: none;
  padding: 0;
}
/* Source lines — each line is a div for commenting */
.source-line {
  display: flex;
  padding: 0 14px 0 6px;
  min-height: 20px;
  user-select: none;
  -webkit-user-select: none;
}
.source-line .line-gutter {
  flex-shrink: 0;
  width: 14px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 11px;
  font-family: var(--font-mono);
  user-select: none;
  -webkit-user-select: none;
}
.source-line .line-content {
  flex: 1;
  white-space: pre;
  overflow-x: visible;
}
.source-line.commented {
  box-shadow: inset 2px 0 0 var(--orange);
}
.source-line .line-gutter {
  position: relative;
}
.source-line .comment-bubble {
  position: static;
  width: 14px;
  height: 14px;
  margin: 3px auto 0;
}
.source-line .comment-bubble svg {
  width: 12px;
  height: 12px;
}
/* Slide mode */
.slides-container {
  display: block;
  position: relative;
}
.slide {
  display: none;
}
.slide.active {
  display: block;
}
.slide-nav {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 8px 0 10px;
  margin-bottom: 8px;
  background: linear-gradient(to bottom, var(--bg) 70%, transparent);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  user-select: none;
}
.slide-nav-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  width: 28px;
  height: 28px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.slide-nav-btn:hover:not(:disabled) {
  border-color: var(--orange);
  color: var(--orange);
}
.slide-nav-btn:disabled {
  opacity: 0.4;
  cursor: default;
}
.slide-counter {
  min-width: 52px;
  text-align: center;
  letter-spacing: 0.04em;
}
.slide-dots {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
  max-width: 260px;
  justify-content: center;
}
.slide-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line);
  cursor: pointer;
  border: none;
  padding: 0;
}
.slide-dot.active {
  background: var(--orange);
}
/* Markdown block commenting */
.md-block {
  position: relative;
}
.md-block.commented::before,
.md-block-table.commented::before,
.md-block-list.commented::before,
.md-block-code.commented::before {
  content: '';
  position: absolute;
  left: -4px;
  top: 2px;
  bottom: 2px;
  width: 2px;
  background: var(--orange);
  border-radius: 1px;
}
.comment-bubble {
  position: absolute;
  left: -26px;
  top: 2px;
  width: 18px;
  height: 18px;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  border-radius: 6px;
  transition: background 120ms ease;
  z-index: 2;
  -webkit-tap-highlight-color: transparent;
}
.comment-bubble:hover, .comment-bubble:active {
  background: var(--orange-soft);
}
.comment-bubble svg {
  width: 14px;
  height: 14px;
  stroke: var(--orange);
  stroke-width: 1.75;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.comment-bubble .count-badge {
  position: absolute;
  top: -4px;
  right: -5px;
  min-width: 12px;
  height: 12px;
  padding: 0 3px;
  box-sizing: border-box;
  border-radius: 7px;
  background: var(--orange);
  color: var(--bg, #1f1f1f);
  font-size: 9px;
  font-weight: 700;
  line-height: 12px;
  text-align: center;
  font-family: var(--font-mono);
  letter-spacing: -0.02em;
  white-space: nowrap;
  box-shadow: 0 0 0 1.5px var(--bg, #1f1f1f);
  pointer-events: none;
}
.md-block-table > .comment-bubble {
  top: 14px;
}
.md-block-list > .comment-bubble {
  top: 4px;
}
.md-block-code > .comment-bubble {
  top: 18px;
}
.code-line {
  display: block;
  min-height: 1em;
  padding: 0;
  border-radius: 2px;
}
.comment-popover {
  position: fixed;
  z-index: 20;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.45);
  min-width: 220px;
  max-width: 320px;
  padding: 4px;
}
.comment-popover-item {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--ink);
  font-family: var(--font-sans, inherit);
  font-size: 13px;
}
.comment-popover-item:hover, .comment-popover-item:active {
  background: var(--surface-2);
}
.comment-popover-item .row-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  margin-bottom: 2px;
}
.comment-popover-item .comment-preview {
  color: var(--ink-mute);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}
/* Markdown tables */
.table-wrap {
  overflow-x: auto;
  margin: 12px 0;
  -webkit-overflow-scrolling: touch;
}
.md-block table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
.md-block th, .md-block td {
  border: 1px solid var(--line);
  padding: 6px 10px;
  text-align: left;
}
.md-block th {
  background: var(--surface-2);
  font-weight: 600;
  color: var(--ink);
}
.md-block tr:nth-child(even) td {
  background: rgba(255, 255, 255, 0.02);
}
/* Prism theme overrides for our dark bg
 * The shipped Prism palette (injected at %%PRISM_CSS%%) is preserved as-is;
 * only the enclosing canvas moves from #0e1117 to --bg. */
/**
 * okaidia theme for JavaScript, CSS and HTML
 * Loosely based on Monokai textmate theme by http://www.monokai.nl/
 * @author ocodia
 */

code[class*="language-"],
pre[class*="language-"] {
	color: #f8f8f2;
	background: none;
	text-shadow: 0 1px rgba(0, 0, 0, 0.3);
	font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
	font-size: 1em;
	text-align: left;
	white-space: pre;
	word-spacing: normal;
	word-break: normal;
	word-wrap: normal;
	line-height: 1.5;

	-moz-tab-size: 4;
	-o-tab-size: 4;
	tab-size: 4;

	-webkit-hyphens: none;
	-moz-hyphens: none;
	-ms-hyphens: none;
	hyphens: none;
}

/* Code blocks */
pre[class*="language-"] {
	padding: 1em;
	margin: .5em 0;
	overflow: auto;
	border-radius: 0.3em;
}

:not(pre) > code[class*="language-"],
pre[class*="language-"] {
	background: #272822;
}

/* Inline code */
:not(pre) > code[class*="language-"] {
	padding: .1em;
	border-radius: .3em;
	white-space: normal;
}

.token.comment,
.token.prolog,
.token.doctype,
.token.cdata {
	color: #8292a2;
}

.token.punctuation {
	color: #f8f8f2;
}

.token.namespace {
	opacity: .7;
}

.token.property,
.token.tag,
.token.constant,
.token.symbol,
.token.deleted {
	color: #f92672;
}

.token.boolean,
.token.number {
	color: #ae81ff;
}

.token.selector,
.token.attr-name,
.token.string,
.token.char,
.token.builtin,
.token.inserted {
	color: #a6e22e;
}

.token.operator,
.token.entity,
.token.url,
.language-css .token.string,
.style .token.string,
.token.variable {
	color: #f8f8f2;
}

.token.atrule,
.token.attr-value,
.token.function,
.token.class-name {
	color: #e6db74;
}

.token.keyword {
	color: #66d9ef;
}

.token.regex,
.token.important {
	color: #fd971f;
}

.token.important,
.token.bold {
	font-weight: bold;
}
.token.italic {
	font-style: italic;
}

.token.entity {
	cursor: help;
}

pre[class*="language-"] { background: var(--bg); }
:not(pre) > code[class*="language-"], pre[class*="language-"] { background: var(--bg); }
code[class*="language-"], pre[class*="language-"] { text-shadow: none; }
/* Loading */
#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.02em;
  gap: 12px;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--line);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#outdated, #empty {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 44px 22px;
  margin: auto;
  flex: 1;
  justify-content: center;
}
.outdated-icon, .empty-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  margin-bottom: 14px;
}
.outdated-icon svg, .empty-icon svg {
  width: 22px; height: 22px;
  stroke: var(--ink-mute);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.outdated-title, .empty-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.outdated-sub, .empty-sub {
  font-size: 12px;
  color: var(--ink-mute);
  margin-top: 6px;
  line-height: 1.5;
}
/* Bottom bar */
#bottombar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--line-soft);
  padding: 10px 16px;
  display: none;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  z-index: 100;
}
#bottombar .hint {
  color: var(--ink-faint);
  font-size: 12px;
}
#bottombar .comment-count {
  color: var(--ink);
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
#bottombar .comment-count::before {
  content: '';
  width: 14px;
  height: 14px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D97757' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/></svg>");
  background-size: contain;
  background-repeat: no-repeat;
  flex-shrink: 0;
}
#bottombar .send-btn {
  background: var(--orange);
  color: var(--paper);
  border: 1px solid var(--orange);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity 120ms ease;
}
#bottombar .send-btn:active { opacity: 0.85; }
#bottombar .send-btn::before {
  content: '';
  width: 14px;
  height: 14px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FAF9F5' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='m3 3 3 9-3 9 19-9Z'/><path d='M6 12h16'/></svg>");
  background-size: contain;
  background-repeat: no-repeat;
}
/* Comment input card */
#comment-card {
  display: none;
  position: fixed;
  left: 10px;
  right: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  z-index: 200;
  box-shadow: 0 4px 20px rgba(0,0,0,0.45);
}
/* #79: when the commented anchor is in the lower half of the viewport,
   the card flips to the top of the screen so it doesn't occlude the
   anchor (most painfully, the bottom of the file). Set via the
   `pin-top` class in openCommentCard. */
#comment-card.pin-top {
  top: 10px;
  bottom: auto;
}
#comment-card .target-chip {
  margin-bottom: 10px;
}
#comment-card .target-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
#comment-card .target-text {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink-mute);
  word-break: break-word;
}
#comment-card textarea {
  width: 100%;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  resize: vertical;
  min-height: 60px;
  max-height: 150px;
}
#comment-card textarea:focus {
  outline: none;
  border: 2px solid var(--orange);
  padding: 9px;
}
#comment-card .card-buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  justify-content: flex-end;
  align-items: center;
}
#comment-card .card-btn {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}
#comment-card .btn-save {
  background: var(--orange);
  color: var(--paper);
  border-color: var(--orange);
}
#comment-card .btn-save:active { opacity: 0.85; }
#comment-card .btn-cancel {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
#comment-card .btn-cancel:hover { border-color: color-mix(in oklch, var(--ink) 25%, var(--line)); }
#comment-card .btn-delete {
  background: var(--surface-2);
  color: var(--ink-mute);
  border-color: var(--line);
  margin-right: auto;
}
#comment-card .btn-delete:hover {
  color: var(--danger);
  border-color: color-mix(in oklch, var(--danger) 40%, var(--line));
}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>Loading document…</div>
</div>
<div id="empty">
  <div class="empty-icon">
    <svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h5"/><path d="M8 17h4"/></svg>
  </div>
  <div class="empty-title">No files open.</div>
  <div class="empty-sub">Ask Claude to send a file to review it here.</div>
</div>
<div id="outdated">
  <div class="outdated-icon">
    <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </div>
  <div class="outdated-title">New version available</div>
  <div class="outdated-sub">A newer file reviewer was sent to this chat. Swipe back and open the latest one.</div>
</div>
<div id="sidebar" class="sidebar"></div>
<div id="search-bar" role="search" aria-label="Find in file">
  <input id="search-input" type="text" aria-label="Find in file" placeholder="Find in file" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <span id="search-counter" class="search-counter" aria-live="polite"></span>
  <button id="search-prev" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">↑</button>
  <button id="search-next" type="button" aria-label="Next match" title="Next match (Enter)">↓</button>
  <button id="search-close" type="button" aria-label="Close search" title="Close (Esc)">×</button>
</div>
<div id="kebab-menu" role="menu" aria-label="File actions">
  <button id="kebab-find" class="kebab-item" type="button" role="menuitem">
    <span class="kebab-item-icon">🔍</span>
    <span class="kebab-item-label">Find in file</span>
    <span class="kebab-item-kbd">⌘F</span>
  </button>
  <button id="kebab-export" class="kebab-item" type="button" role="menuitem">
    <span class="kebab-item-icon">⬇️</span>
    <span class="kebab-item-label">Export file</span>
  </button>
</div>
<div id="content" class="content" style="display:none"></div>
<div id="bottombar">
  <span class="hint" id="bar-hint">Long-press any line or paragraph to add a comment.</span>
  <span class="comment-count" id="bar-count" style="display:none"></span>
  <button class="send-btn" id="bar-send" style="display:none">Send to chat</button>
</div>
<div id="close-dialog" class="dialog-overlay">
  <div class="dialog">
    <div class="dialog-title">Close this file?</div>
    <div class="dialog-body" id="close-dialog-body"></div>
    <div class="dialog-actions">
      <button class="dialog-btn cancel" id="close-dialog-cancel">Cancel</button>
      <button class="dialog-btn confirm" id="close-dialog-confirm">Close</button>
    </div>
  </div>
</div>
<div id="comment-card">
  <div class="target-chip">
    <div class="target-label" id="card-label">Commenting on</div>
    <div class="target-text" id="card-target"></div>
  </div>
  <textarea id="comment-text" placeholder="Type your note…"></textarea>
  <div class="card-buttons">
    <button class="card-btn btn-delete" id="card-delete" style="display:none">Delete</button>
    <button class="card-btn btn-cancel" id="card-cancel">Cancel</button>
    <button class="card-btn btn-save" id="card-save">Save comment</button>
  </div>
</div>
