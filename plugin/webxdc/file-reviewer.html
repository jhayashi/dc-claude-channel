          }
          child.appendChild(lineDiv);
          (function(pi, el) {
            attachLongPress(el, function() { openCommentCard(pi); });
          })(paraIdx, lineDiv);
          paraIdx++;
        }

        if (commentedLines.length > 0) {
          preBlock.classList.add('commented');
          (function(cl) {
            var bubble = makeCommentBubble(function() {
              if (cl.length === 1) { openCommentCard(cl[0].para); }
              else { showCommentPopover(bubble, cl, 'Line'); }
            }, cl.length);
            preBlock.insertBefore(bubble, preBlock.firstChild);
          })(commentedLines);
        }
        continue;
      }
      // No <code> child: fall through to default block handling.
    }

    var block = document.createElement('div');
    block.className = 'md-block' + (comments[paraIdx] ? ' commented' : '');
    block.setAttribute('data-paragraph', String(paraIdx));
    block.appendChild(child);
    container.appendChild(block);

    // Long-press handler
    (function(pi) {
      attachLongPress(block, function() { openCommentCard(pi); });
    })(paraIdx);

    // Commented blocks get a tappable bubble in the left margin.
    if (comments[paraIdx]) {
      (function(pi) {
        var bubble = makeCommentBubble(function() { openCommentCard(pi); });
        block.insertBefore(bubble, block.firstChild);
      })(paraIdx);
    }

    paraIdx++;
  }
  return paraIdx;
}

/**
 * Render markdown with per-block wrappers for commenting. Auto-detects
 * Marp slide mode and emits per-slide <section> wrappers when applicable.
 * Writes slide metadata to documents[docIndex].slides/currentSlide/paraToSlide.
 */
function renderMarkdownWithBlocks(md, docIndex) {
  var detection = detectMarp(md);
  var doc = documents[docIndex];
  var comments = getComments(docIndex);
  var container = document.createElement('div');

  if (!detection.isSlides) {
    // Clear any stale slide state from a prior render
    if (doc) {
      doc.slides = null;
      doc.currentSlide = 0;
      doc.paraToSlide = null;
    }
    var temp = document.createElement('div');
    temp.innerHTML = renderMarkdown(md);  // eslint-disable-line
    var nodes = Array.prototype.slice.call(temp.childNodes);
    renderBlocksInto(container, nodes, 0, comments);
    return container;
  }

  // Slide mode: split body on --- and render each slide into its own section
  container.classList.add('slides-container');
  var slideTexts = detection.body.split(/\r?\n---\r?\n/);
  var cleanSlides = [];
  for (var s = 0; s < slideTexts.length; s++) {
    var t = slideTexts[s].trim();
    if (t) cleanSlides.push(t);
  }
  if (doc) {
    doc.slides = cleanSlides;
    if (typeof doc.currentSlide !== 'number' || doc.currentSlide >= cleanSlides.length || doc.currentSlide < 0) {
      doc.currentSlide = 0;
    }
    doc.paraToSlide = {};
  }

  // Sticky nav bar at top of the container
  var nav = buildSlideNav(cleanSlides.length, doc ? doc.currentSlide : 0);
  container.appendChild(nav);

  var paraIdx = 0;
  for (var si = 0; si < cleanSlides.length; si++) {
    var section = document.createElement('section');
    section.className = 'slide' + (doc && si === doc.currentSlide ? ' active' : '');
    section.setAttribute('data-slide-index', String(si));

    var tempSlide = document.createElement('div');
    tempSlide.innerHTML = renderMarkdown(cleanSlides[si]);  // eslint-disable-line
    var slideNodes = Array.prototype.slice.call(tempSlide.childNodes);
    var prevPara = paraIdx;
    paraIdx = renderBlocksInto(section, slideNodes, paraIdx, comments);
    if (doc) {
      for (var p = prevPara; p < paraIdx; p++) doc.paraToSlide[p] = si;
    }
    container.appendChild(section);
  }
  return container;
}

/**
 * Build the slide navigation bar (prev, counter, next, dots). Returns the
 * element. All interaction is routed through showSlide().
 */
function buildSlideNav(total, current) {
  var nav = document.createElement('div');
  nav.className = 'slide-nav';

  var prev = document.createElement('button');
  prev.className = 'slide-nav-btn';
  prev.setAttribute('data-dir', 'prev');
  prev.setAttribute('aria-label', 'Previous slide');
  prev.textContent = '\u25C0';
  prev.addEventListener('click', function() { showSlide((documents[activeIndex] && documents[activeIndex].currentSlide || 0) - 1); });
  nav.appendChild(prev);

  var counter = document.createElement('span');
  counter.className = 'slide-counter';
  counter.textContent = (current + 1) + ' / ' + total;
  nav.appendChild(counter);

  var next = document.createElement('button');
  next.className = 'slide-nav-btn';
  next.setAttribute('data-dir', 'next');
  next.setAttribute('aria-label', 'Next slide');
  next.textContent = '\u25B6';
  next.addEventListener('click', function() { showSlide((documents[activeIndex] && documents[activeIndex].currentSlide || 0) + 1); });
  nav.appendChild(next);

  if (total <= 20) {
    var dotsEl = document.createElement('div');
    dotsEl.className = 'slide-dots';
    for (var d = 0; d < total; d++) {
      var dot = document.createElement('button');
      dot.className = 'slide-dot' + (d === current ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to slide ' + (d + 1));
      (function(idx) {
        dot.addEventListener('click', function() { showSlide(idx); });
      })(d);
      dotsEl.appendChild(dot);
    }
    nav.appendChild(dotsEl);
  }

  updateSlideNavState(nav, current, total);
  return nav;
}

/**
 * Update disabled state + counter text + active dot on a slide-nav element.
 */
function updateSlideNavState(nav, current, total) {
  if (!nav) return;
  var prev = nav.querySelector('.slide-nav-btn[data-dir="prev"]');
  var next = nav.querySelector('.slide-nav-btn[data-dir="next"]');
  var counter = nav.querySelector('.slide-counter');
  if (prev) prev.disabled = current <= 0;
  if (next) next.disabled = current >= total - 1;
  if (counter) counter.textContent = (current + 1) + ' / ' + total;
  var dots = nav.querySelectorAll('.slide-dot');
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = 'slide-dot' + (i === current ? ' active' : '');
  }
}

/**
 * Switch to slide `idx` on the currently active doc. Clamps bounds silently.
 * No-op if the active doc isn't in slide mode.
 */
function showSlide(idx) {
  var doc = documents[activeIndex];
  if (!doc || !doc.slides) return;
  var total = doc.slides.length;
  if (idx < 0) idx = 0;
  if (idx >= total) idx = total - 1;
  if (idx === doc.currentSlide) return;
  doc.currentSlide = idx;

  var contentEl = document.getElementById('content');
  var container = contentEl.querySelector('.slides-container');
  if (!container) return;

  var sections = container.querySelectorAll('.slide');
  for (var i = 0; i < sections.length; i++) {
    var si = Number(sections[i].getAttribute('data-slide-index'));
    sections[i].classList.toggle('active', si === idx);
  }

  var nav = container.querySelector('.slide-nav');
  updateSlideNavState(nav, idx, total);

  // Scroll the container to top so the new slide starts at the top
  contentEl.scrollTop = 0;
}

/**
 * Build a tappable MessageSquare bubble. The onTap callback fires on click.
 * Touch events are stopPropagation'd to avoid triggering long-press on parent.
 */
function makeCommentBubble(onTap, count) {
  var bubble = document.createElement('span');
  bubble.className = 'comment-bubble';
  bubble.setAttribute('role', 'button');
  var n = typeof count === 'number' ? count : 0;
  bubble.setAttribute('aria-label', n > 1 ? ('Show ' + n + ' comments') : 'Show comment');
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z');
  svg.appendChild(path);
  bubble.appendChild(svg);
  if (n > 1) {
    var badge = document.createElement('span');
    badge.className = 'count-badge';
    badge.textContent = n > 9 ? '9+' : String(n);
    bubble.appendChild(badge);
  }
  bubble.addEventListener('click', function(e) {
    e.stopPropagation();
    e.preventDefault();
    onTap();
  });
  bubble.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });
  bubble.addEventListener('mousedown', function(e) { e.stopPropagation(); });
  return bubble;
}

/**
 * Show a popover near `anchor` listing `items` (commented rows/items/lines).
 * Each item: { para, rowIndex, text }. Tap → scroll to row + open its card.
 * `prefix` is the label noun ("Row", "Item", "Line"). Defaults to "Row".
 */
function showCommentPopover(anchor, items, prefix) {
  prefix = prefix || 'Row';
  closeCommentPopover();
  var pop = document.createElement('div');
  pop.className = 'comment-popover';
  pop.id = 'comment-popover';
  for (var i = 0; i < items.length; i++) {
    (function(it) {
      var btn = document.createElement('button');
      btn.className = 'comment-popover-item';
      btn.type = 'button';
      var label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = prefix + ' ' + it.rowIndex;
      var preview = document.createElement('span');
      preview.className = 'comment-preview';
      preview.textContent = it.text;
      btn.appendChild(label);
      btn.appendChild(preview);
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeCommentPopover();
        if (it.rowEl && it.rowEl.scrollIntoView) {
          it.rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        openCommentCard(it.para);
      });
      pop.appendChild(btn);
    })(items[i]);
  }
  document.body.appendChild(pop);
  // Position after mounting so we can measure popover height.
  var rect = anchor.getBoundingClientRect();
  var popRect = pop.getBoundingClientRect();
  var left = rect.right + 6;
  var top = rect.top;
  if (left + popRect.width > window.innerWidth - 8) {
    left = Math.max(8, window.innerWidth - popRect.width - 8);
  }
  if (top + popRect.height > window.innerHeight - 8) {
    top = Math.max(8, window.innerHeight - popRect.height - 8);
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  setTimeout(function() {
    document.addEventListener('click', commentPopoverOutsideClick);
    window.addEventListener('scroll', closeCommentPopover, true);
    window.addEventListener('resize', closeCommentPopover);
  }, 0);
}
function commentPopoverOutsideClick(e) {
  var pop = document.getElementById('comment-popover');
  if (!pop) return;
  if (!pop.contains(e.target)) closeCommentPopover();
}
function closeCommentPopover() {
  var pop = document.getElementById('comment-popover');
  if (pop && pop.parentNode) pop.parentNode.removeChild(pop);
  document.removeEventListener('click', commentPopoverOutsideClick);
  window.removeEventListener('scroll', closeCommentPopover, true);
  window.removeEventListener('resize', closeCommentPopover);
}

/**
 * Attach a long-press (500ms) handler to an element. Also registers a
 * contextmenu (right-click) handler that fires the same callback as a
 * mouse / keyboard alternative.
 *
 * #75 rewrite: migrated from the touchstart/mousedown split (which had
 * a late preventDefault inside setTimeout — useless against the OS's
 * own long-press timer) to a unified PointerEvents implementation:
 *
 *   - synchronous preventDefault on pointerdown (defense-in-depth — the
 *     CSS in .content li[data-paragraph] et al is the actual cure for
 *     native gesture suppression)
 *   - setPointerCapture so subsequent move/up events route to `el` even
 *     if the finger slides off it (without capture, an off-target
 *     pointermove fires on a different element and cancel never runs)
 *   - 14px move threshold (matches Flutter kTouchSlop=18, Android
 *     ScaledTouchSlop floor; was 4-6 in the plan — too aggressive,
 *     touch-jitter cancels long-press on older devices)
 *   - pointerType/button discrimination (right-click and middle-click
 *     no longer start the timer; right-click routes to contextmenu)
 *   - isConnected guard before firing callback (doc may have been
 *     re-rendered during the 500ms hold via version_mismatch or tab
 *     switch — fire on stale paragraph index = wrong content)
 *   - haptic tick on success via navigator.vibrate(10) (Android only;
 *     iOS WKWebView silently ignores)
 */
var LONG_PRESS_MS = 500;
var LONG_PRESS_MOVE_THRESHOLD_PX = 14;

function attachLongPress(el, callback) {
  var timer = null;
  var startX = 0, startY = 0;
  var pointerId = null;

  function clear() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (pointerId !== null) {
      try { el.releasePointerCapture(pointerId); } catch (_) {}
      pointerId = null;
    }
  }

  el.addEventListener('pointerdown', function(e) {
    // Right-click + middle-click on a mouse don't start long-press; they
    // route through contextmenu instead.
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // Tap on a link should navigate, not long-press-comment. The sync
    // preventDefault below would suppress the synthetic click; bail out
    // so the browser's link-handling runs. (Regression from #75 — the
    // preventDefault is admitted defense-in-depth there; the CSS
    // user-select / touch-callout rules are the actual long-press cure.)
    if (e.target && e.target.closest && e.target.closest('a[href]')) return;
    clear();
    pointerId = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    startX = e.clientX;
    startY = e.clientY;
    e.preventDefault();  // defense-in-depth — suppress synthetic mouse follow-on
    timer = setTimeout(function() {
      timer = null;
      // Element may have been removed during the 500ms hold (tab switch,
      // version_mismatch re-render). Fire on stale → wrong-content card.
      if (!el.isConnected) return;
      try { if (navigator.vibrate) navigator.vibrate(10); } catch (_) {}
      callback();
    }, LONG_PRESS_MS);
  });

  el.addEventListener('pointermove', function(e) {
    if (e.pointerId !== pointerId) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    if (dx * dx + dy * dy > LONG_PRESS_MOVE_THRESHOLD_PX * LONG_PRESS_MOVE_THRESHOLD_PX) clear();
  });
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointercancel', clear);
  el.addEventListener('pointerleave', clear);  // defensive; capture should prevent

  // Mouse / keyboard alternative — right-click (and the "Apps" key on
  // some keyboards) fires the same callback. Accessibility floor for
  // users who can't long-press.
  el.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (el.isConnected) callback();
  });
}

// ── Comment card ────────────────────────────────────────────────────

// #76: scroll-reactive flip. Once the card is open, scrolling toward the
// card's pinned edge flips the card to the opposite edge so it gets out
// of the user's way. Throttled with rAF; thresholded to filter touch
// wobble; cooldown to prevent jitter; suppressed while the user is
// actively composing.
var _cardScrollListener = null;
var _cardLastScrollY = 0;
var _cardLastFlipMs = 0;
var SCROLL_DELTA_THRESHOLD = 50;
var FLIP_COOLDOWN_MS = 800;

function flipCardTo(pinTop) {
  var card = document.getElementById('comment-card');
  if (!card) return;
  card.classList.toggle('pin-top', pinTop);
  if (pinTop) {
    card.style.bottom = '';
    card.style.top = '';
  } else {
    card.style.bottom = '62px';
    card.style.top = 'auto';
  }
  _cardLastFlipMs = Date.now();
}

function installCardScrollListener() {
  removeCardScrollListener();
  _cardLastScrollY = window.scrollY;
  // Note: _cardLastFlipMs is set by flipCardTo at open time, so the
  // cooldown naturally blocks an immediate first scroll-flip.
  var pending = false;
  _cardScrollListener = function () {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () {
      pending = false;
      var card = document.getElementById('comment-card');
      if (!card || card.style.display !== 'block') return;
      var y = window.scrollY;
      var dy = y - _cardLastScrollY;
      _cardLastScrollY = y;
      if (Math.abs(dy) < SCROLL_DELTA_THRESHOLD) return;
      if (Date.now() - _cardLastFlipMs < FLIP_COOLDOWN_MS) return;
      // Don't yank the card while the user is composing a comment.
      var ta = document.getElementById('comment-text');
      if (ta && document.activeElement === ta && ta.value.trim().length > 0) return;
      var pinTop = card.classList.contains('pin-top');
      if (dy > 0 && !pinTop) {
        // Scrolling down, card at bottom → flip to top.
        flipCardTo(true);
      } else if (dy < 0 && pinTop) {
        // Scrolling up, card at top → flip to bottom.
        flipCardTo(false);
      }
    });
  };
  window.addEventListener('scroll', _cardScrollListener, { passive: true });
}

function removeCardScrollListener() {
  if (_cardScrollListener) {
    window.removeEventListener('scroll', _cardScrollListener);
    _cardScrollListener = null;
  }
}

function openCommentCard(anchor) {
  // #77: if search is open, close it first. <mark.search-match>
  // wrappers can capture pointer events inside commentable blocks,
  // and the comment-card layout can interact oddly with stray
  // wrappers. Closing the search clears the marks AND restores focus
  // hygiene before the textarea grabs it.
  if (_searchOpen) closeSearch();
  editingAnchor = anchor;
  var comments = getComments(activeIndex);
  var existing = comments[anchor];

  var textarea = document.getElementById('comment-text');
  textarea.value = existing || '';

  var deleteBtn = document.getElementById('card-delete');
  deleteBtn.style.display = existing ? 'inline-block' : 'none';

  // Populate the target chip: "line N \u00b7 file" for source docs,
  // "block N \u00b7 file" for markdown blocks.
  var doc = documents[activeIndex];
  var title = (doc && doc.title) || '';
  var isSource = !!(doc && doc.language);
  var anchorLabel = isSource ? ('line ' + anchor) : ('block ' + (Number(anchor) + 1));
  document.getElementById('card-label').textContent = existing ? 'Editing comment' : 'Commenting on';
  document.getElementById('card-target').textContent = title ? (anchorLabel + ' \u00b7 ' + title) : anchorLabel;

  var card = document.getElementById('comment-card');
  // #76: pick top/bottom pin based on where the commented anchor sits
  // in the viewport. If the anchor is in the lower half, pin to top so
  // the card doesn't cover it (most painful at the bottom of the file).
  // Otherwise default to the bottom-pinned position. Evaluated only at
  // open time — scroll-reactive flipping is a future polish.
  var anchorSelector = isSource
    ? '[data-line="' + anchor + '"]'
    : '[data-paragraph="' + anchor + '"]';
  var anchorEl = document.querySelector(anchorSelector);
  var pinTop = false;
  if (anchorEl) {
    var rect = anchorEl.getBoundingClientRect();
    pinTop = rect.top > window.innerHeight / 2;
  }
  flipCardTo(pinTop);
  card.style.display = 'block';
  installCardScrollListener();

  setTimeout(function() { textarea.focus(); }, 100);
}

function closeCommentCard() {
  document.getElementById('comment-card').style.display = 'none';
  editingAnchor = null;
  removeCardScrollListener();
}

function saveComment() {
  if (editingAnchor === null) return;
  var text = document.getElementById('comment-text').value.trim();
  if (!text) { closeCommentCard(); return; }

  var comments = getComments(activeIndex);
  comments[editingAnchor] = text;
  closeCommentCard();
  showDocument(activeIndex);
  updateBottomBar();
}

function deleteComment() {
  if (editingAnchor === null) return;
  var comments = getComments(activeIndex);
  delete comments[editingAnchor];
  closeCommentCard();
  showDocument(activeIndex);
  updateBottomBar();
}

document.getElementById('card-save').addEventListener('click', saveComment);
document.getElementById('card-cancel').addEventListener('click', closeCommentCard);
document.getElementById('card-delete').addEventListener('click', deleteComment);

// ── Bottom bar ──────────────────────────────────────────────────────

function updateBottomBar() {
  var bar = document.getElementById('bottombar');
  var hint = document.getElementById('bar-hint');
  var count = document.getElementById('bar-count');
  var sendBtn = document.getElementById('bar-send');

  if (activeIndex < 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  var n = commentCount(activeIndex);
  if (n === 0) {
    hint.style.display = 'inline';
    count.style.display = 'none';
    sendBtn.style.display = 'none';
  } else {
    hint.style.display = 'none';
    count.style.display = 'inline';
    count.textContent = n + ' comment' + (n === 1 ? '' : 's');
    sendBtn.style.display = 'inline-block';
  }
}

function sendComments() {
  if (activeIndex < 0) return;
  var doc = documents[activeIndex];
  var comments = getComments(activeIndex);
  var keys = Object.keys(comments);
  if (keys.length === 0) return;

  // Build comment array
  var commentList = [];
  var lines = doc.content.split('\n');
  for (var i = 0; i < keys.length; i++) {
    var anchor = Number(keys[i]);
    var entry = { comment: comments[anchor] };

    if (doc.language) {
      // Source: anchor is line number (1-indexed)
      entry.line = anchor;
      entry.context = (lines[anchor - 1] || '').trim();
    } else {
      // Markdown: anchor is paragraph index
      entry.paragraph = anchor;
      // Slide-aware: tag which slide this block belongs to (0-indexed)
      if (doc.paraToSlide && doc.paraToSlide[anchor] !== undefined) {
        entry.slide = doc.paraToSlide[anchor];
      }
      // Get paragraph text from the rendered content
      var blocks = document.querySelectorAll('[data-paragraph="' + anchor + '"]');
      entry.context = blocks.length > 0 ? blocks[0].textContent.substring(0, 200).trim().replace(/\s+/g, ' ') : '';
    }
    commentList.push(entry);
  }

  // Sort by anchor position
  commentList.sort(function(a, b) {
    return (a.line || a.paragraph || 0) - (b.line || b.paragraph || 0);
  });

  var payload = {
    type: 'comments',
    fileTitle: doc.title,
    // #112: stable key so a reopened reviewer can suppress this file on
    // replay. fileTitle alone is ambiguous when two files share a title.
    fileId: doc.fileId || null,
    comments: commentList,
    senderAddr: window.webxdc.selfAddr,
  };
  if (doc.language) payload.language = doc.language;

  var n = commentList.length;
  var raw = (window.webxdc.selfName || '').trim();
  var looksLikeId = !raw || /^[0-9a-f]{16,}$/i.test(raw);
  var firstName = looksLikeId ? '' : raw.split(/\s+/)[0];
  var phrase = (n === 1 ? '1 comment' : n + ' comments');
  var infoText = firstName
    ? firstName + ' sent ' + phrase + ' for ' + doc.title
    : phrase + ' sent for ' + doc.title;
  window.webxdc.sendUpdate({ payload: payload, info: infoText }, infoText);

  // Remove the file from the app
  var removedIndex = activeIndex;
  delete commentsByDoc[removedIndex];
  documents.splice(removedIndex, 1);

  // Re-index commentsByDoc for shifted indices
  var newComments = {};
  var oldKeys = Object.keys(commentsByDoc);
  for (var j = 0; j < oldKeys.length; j++) {
    var oldIdx = Number(oldKeys[j]);
    if (oldIdx > removedIndex) {
      newComments[oldIdx - 1] = commentsByDoc[oldIdx];
    } else {
      newComments[oldIdx] = commentsByDoc[oldIdx];
    }
  }
  commentsByDoc = newComments;
  persistFrCacheNow();

  // Show next file or loading state
  if (documents.length === 0) {
    activeIndex = -1;
    document.getElementById('content').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
    document.getElementById('bottombar').style.display = 'none';
    rebuildSidebar();
  } else {
    activeIndex = Math.min(removedIndex, documents.length - 1);
    rebuildSidebar();
    showDocument(activeIndex);
    updateBottomBar();
  }
}

document.getElementById('bar-send').addEventListener('click', sendComments);

// ── Slide-mode keyboard + swipe navigation ──────────────────────────

function isSlideModeActive() {
  var doc = documents[activeIndex];
  return !!(doc && doc.slides && doc.slides.length > 1);
}

document.addEventListener('keydown', function(e) {
  // #77: Cmd/Ctrl+F opens search. Synchronously preventDefault so the
  // host webview's browser-level find UI doesn't compete. If a platform
  // eats the keybind before the page sees it, the 🔍 button is the
  // universal fallback.
  if ((e.metaKey || e.ctrlKey) && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault();
    openSearch();
    return;
  }

  if (!isSlideModeActive()) return;
  // Don't hijack arrow keys while typing in the comment card
  var tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  var doc = documents[activeIndex];
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    showSlide(doc.currentSlide - 1);
    e.preventDefault();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    showSlide(doc.currentSlide + 1);
    e.preventDefault();
  }
});

(function() {
  var contentEl = document.getElementById('content');
  if (!contentEl) return;
  var startX = 0;
  var startY = 0;
  var tracking = false;
  contentEl.addEventListener('touchstart', function(e) {
    if (!isSlideModeActive()) return;
    // Skip swipe if the touch started on a comment bubble or nav button
    var t = e.target;
    while (t && t !== contentEl) {
      if (t.classList && (t.classList.contains('comment-bubble') ||
          t.classList.contains('slide-nav-btn') || t.classList.contains('slide-dot'))) {
        return;
      }
      t = t.parentNode;
    }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });
  contentEl.addEventListener('touchend', function(e) {
    if (!tracking || !isSlideModeActive()) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      var doc = documents[activeIndex];
      if (dx < 0) showSlide(doc.currentSlide + 1);
      else showSlide(doc.currentSlide - 1);
    }
  }, { passive: true });
})();

// ── Document display ────────────────────────────────────────────────

function showDocument(index) {
  if (index < 0 || index >= documents.length) return;
  // #77: tab switch closes the search. The new doc's DOM is built
  // fresh below; any marks from the old doc would be wiped anyway,
  // but closing the bar explicitly is the cleaner UX.
  if (_searchOpen) closeSearch();
  activeIndex = index;
  var contentEl = document.getElementById('content');
  contentEl.style.display = 'block';
  contentEl.replaceChildren();

  var doc = documents[index];
  if (doc.language) {
    contentEl.classList.add('source-mode');
    contentEl.appendChild(renderSource(doc.content, doc.language, index));
  } else {
    contentEl.classList.remove('source-mode');
    contentEl.appendChild(renderMarkdownWithBlocks(doc.content, index));
  }

  var tabs = document.querySelectorAll('.doc-tab');
  var activeTab = null;
  for (var i = 0; i < tabs.length; i++) {
    var on = Number(tabs[i].getAttribute('data-index')) === index;
    tabs[i].className = 'doc-tab' + (on ? ' active' : '');
    if (on) activeTab = tabs[i];
  }
  scrollTabIntoView(activeTab);

  updateBottomBar();
}

// Horizontal-only scroll so the active tab's title is visible. Sidebar
// renders newest-first (left), so opening an older file lands on a tab
// that may sit off-screen to the right under newer ones (#73 testing
// surfaced this on phone). Adjusts sidebar.scrollLeft only — never
// touches page or sidebar vertical scroll.
function scrollTabIntoView(tab) {
  if (!tab) return;
  // #99: scroller is the inner .sidebar-tabs now, not the outer .sidebar.
  var scroller = document.querySelector('#sidebar .sidebar-tabs');
  if (!scroller) return;
  var sRect = scroller.getBoundingClientRect();
  var tRect = tab.getBoundingClientRect();
  if (tRect.left < sRect.left) {
    scroller.scrollLeft += tRect.left - sRect.left;
  } else if (tRect.right > sRect.right) {
    scroller.scrollLeft += tRect.right - sRect.right;
  }
}

// #78: assemble the active document — and any sibling chunks of the
// same logical file — into a single text blob for export.
// Pre-v1.48 only chunk 0 carried fileId; for those legacy entries we
// fall back to grouping by stripped-suffix title.
function collectFileForExport() {
  if (activeIndex < 0 || activeIndex >= documents.length) return null;
  var active = documents[activeIndex];
  var fileId = active.fileId;
  // Strip "(N-M)" suffix and trailing whitespace for base-title comparison.
  function baseTitle(t) {
    return (t || '').replace(/\s*\(\d+-\d+\)\s*$/, '').trim();
  }
  var activeBase = baseTitle(active.title || '');
  var matches = [];
  for (var i = 0; i < documents.length; i++) {
    var d = documents[i];
    var match = false;
    if (fileId && d.fileId === fileId) match = true;
    else if (!fileId && baseTitle(d.title || '') === activeBase) match = true;
    if (match) matches.push(d);
  }
  // Sort by startLine so chunks concatenate in source order.
  matches.sort(function(a, b) {
    return (a.startLine || 1) - (b.startLine || 1);
  });
  var content = matches.map(function(d) { return d.content || ''; }).join('\n');
  return {
    title: activeBase || active.title || 'Untitled',
    language: active.language || null,
    content: content,
  };
}

// #78: three-tier filename inference. title-extension wins; else
// map language to ext; else .txt fallback (never .md for unknown).
function inferExportFilename(title, language) {
  if (/\.[A-Za-z0-9]+$/.test(title)) return title;
  if (language && LANG_TO_EXT[language]) return title + '.' + LANG_TO_EXT[language];
  return title + '.txt';
}

function dismissExportToast() {
  var existing = document.querySelector('.export-toast');
  if (existing) existing.remove();
  if (exportToastTimer) { clearTimeout(exportToastTimer); exportToastTimer = null; }
}

function showExportToast(kind, text) {
  dismissExportToast();
  var sidebar = document.getElementById('sidebar');
  if (!sidebar || !sidebar.parentNode) return;
  var toast = document.createElement('div');
  toast.className = 'export-toast ' + kind;
  var dot = document.createElement('span');
  dot.className = 'dot';
  dot.textContent = kind === 'success' ? '✓' : '!';
  var span = document.createElement('span');
  span.textContent = text;
  toast.appendChild(dot);
  toast.appendChild(span);
  sidebar.parentNode.insertBefore(toast, sidebar.nextSibling);
  // Auto-dismiss success after 2s; keep errors longer so user can read.
  exportToastTimer = setTimeout(dismissExportToast, kind === 'success' ? 2000 : 5000);
}

// Single-flight guard for export. The kebab is the only entry point;
// menu closes on item-click so users can't easily double-fire, but a
// flag is cheap insurance.
var _exporting = false;

function exportActiveFile() {
  if (_exporting) return;
  dismissExportToast();
  var bundle = collectFileForExport();
  if (!bundle) {
    showExportToast('error', 'No active document to export');
    return;
  }
  var byteLen = new TextEncoder().encode(bundle.content).length;
  if (byteLen > MAX_EXPORT_BYTES) {
    var kb = Math.round(byteLen / 1024);
    var capKb = Math.round(MAX_EXPORT_BYTES / 1024);
    showExportToast('error', 'Too large to export (' + kb + ' KB > ' + capKb + ' KB cap)');
    return;
  }
  _exporting = true;
  var filename = inferExportFilename(bundle.title, bundle.language);
  pendingExportRequestId = pendingExportRequestId + 1;
  var requestId = pendingExportRequestId;
  window.webxdc.sendUpdate({
    payload: {
      type: 'export-file',
      requestId: requestId,
      filename: filename,
      content: bundle.content,
      language: bundle.language,
      senderAddr: window.webxdc.selfAddr,
    },
    summary: 'Export file: ' + filename,
  }, '');
}

function handleExportResult(data) {
  // Ignore stale results (a newer export was kicked off after this one).
  if (data.requestId !== undefined && data.requestId !== pendingExportRequestId) return;
  _exporting = false;
  if (data.ok) {
    showExportToast('success', 'Sent to chat');
  } else {
    var msg = data.message ? ('Export failed: ' + data.message) : 'Export failed';
    showExportToast('error', msg);
  }
}

// ── Kebab menu (file actions) ──────────────────────────────────────
var _kebabOpen = false;

function toggleKebabMenu() {
  if (_kebabOpen) closeKebabMenu();
  else openKebabMenu();
}

function openKebabMenu() {
  var btn = document.getElementById('kebab-btn');
  var menu = document.getElementById('kebab-menu');
  if (!btn || !menu) return;
  // Position the menu directly under the kebab button's right edge.
  var rect = btn.getBoundingClientRect();
  var menuWidth = 220;  // approximate; the menu's actual width may vary slightly
  var left = Math.max(8, Math.min(rect.right - menuWidth, window.innerWidth - menuWidth - 8));
  menu.style.left = left + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.classList.add('visible');
  btn.setAttribute('aria-expanded', 'true');
  _kebabOpen = true;
}

function closeKebabMenu() {
  var btn = document.getElementById('kebab-btn');
  var menu = document.getElementById('kebab-menu');
  if (menu) menu.classList.remove('visible');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  _kebabOpen = false;
}

function wireKebabMenu() {
  var find = document.getElementById('kebab-find');
  var exp = document.getElementById('kebab-export');
  if (find) {
    find.addEventListener('click', function() {
      closeKebabMenu();
      openSearch();
    });
  }
  if (exp) {
    exp.addEventListener('click', function() {
      closeKebabMenu();
      exportActiveFile();
    });
  }
  // Outside-click closes the menu. Listen on document so any tap
  // outside the menu or the kebab button itself closes the popover.
  document.addEventListener('click', function(e) {
    if (!_kebabOpen) return;
    var menu = document.getElementById('kebab-menu');
    var btn = document.getElementById('kebab-btn');
    if (menu && menu.contains(e.target)) return;
    if (btn && btn.contains(e.target)) return;
    closeKebabMenu();
  });
  // Esc closes the menu (when it's the active layer). Doesn't conflict
  // with search Esc handling because the search input grabs focus when
  // search is open and consumes its own Esc.
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && _kebabOpen) {
      closeKebabMenu();
    }
  });
}

// ── #77: find / in-document search ─────────────────────────────────
var SEARCH_DEBOUNCE_MS = 100;
var SEARCH_MATCH_CAP = 1000;
var _searchOpen = false;
var _searchLastFocus = null;
var _searchDebounceTimer = null;
var _searchCurrentIdx = -1;
var _searchMatchCount = 0;
var _searchCapped = false;

function openSearch() {
  if (_searchOpen) {
    var existingInput = document.getElementById('search-input');
    if (existingInput) existingInput.focus();
    return;
  }
  _searchLastFocus = document.activeElement;
  _searchOpen = true;
  document.body.classList.add('searching');
  var input = document.getElementById('search-input');
  if (input) {
    input.value = '';
    input.focus();
  }
  updateSearchCounter(0, 0);
}

function closeSearch() {
  if (!_searchOpen) return;
  if (_searchDebounceTimer) { clearTimeout(_searchDebounceTimer); _searchDebounceTimer = null; }
  clearSearchMarks();
  _searchOpen = false;
  _searchCurrentIdx = -1;
  _searchMatchCount = 0;
  _searchCapped = false;
  document.body.classList.remove('searching');
  // Restore focus to the previously-focused element (if still attached)
  // or document.body — never leave focus dangling on the × button.
  var target = (_searchLastFocus && _searchLastFocus.isConnected) ? _searchLastFocus : document.body;
  try { target.focus(); } catch (_) {}
  _searchLastFocus = null;
}

// Clear all search-match wrappers and normalize text nodes back.
function clearSearchMarks() {
  var marks = document.querySelectorAll('mark.search-match');
  for (var i = 0; i < marks.length; i++) {
    var m = marks[i];
    var parent = m.parentNode;
    if (!parent) continue;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
  }
  // Merge adjacent text nodes that were split by the marks
  // (call normalize on the rendered content container).
  var content = document.getElementById('content');
  if (content) {
    try { content.normalize(); } catch (_) {}
  }
  // Drop source-mode gutter indicators
  var lit = document.querySelectorAll('.source-line.has-search-match');
  for (var j = 0; j < lit.length; j++) lit[j].classList.remove('has-search-match');
}

function updateSearchCounter(currentOneBased, total) {
  var el = document.getElementById('search-counter');
  if (!el) return;
  if (total === 0) {
    el.textContent = '';
    el.classList.remove('no-matches');
  } else if (total > SEARCH_MATCH_CAP) {
    el.textContent = SEARCH_MATCH_CAP + '+ matches';
    el.classList.remove('no-matches');
  } else if (currentOneBased <= 0) {
    el.textContent = '0 of ' + total;
    el.classList.add('no-matches');
  } else {
    el.textContent = currentOneBased + ' of ' + total;
    el.classList.remove('no-matches');
  }
  // Update prev/next button enabled state
  var prev = document.getElementById('search-prev');
  var next = document.getElementById('search-next');
  if (prev) prev.disabled = total === 0;
  if (next) next.disabled = total === 0;
}

// Build a flat text + nodeMap from #content. Walks all visible text
// nodes including those inside Prism token spans (so source-mode
// matches work). Skips text nodes inside <mark.search-match> elements
// (which shouldn't exist when this is called fresh, but defensive).
function buildFlatTextIndex() {
  var root = document.getElementById('content');
  if (!root) return { flat: '', nodeMap: [] };
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node) {
      var p = node.parentElement;
      while (p && p !== root) {
        if (p.tagName === 'MARK' && p.classList.contains('search-match')) return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  var parts = [];
  var nodeMap = [];
  var offset = 0;
  while (walker.nextNode()) {
    var n = walker.currentNode;
    var text = n.nodeValue || '';
    if (!text) continue;
    nodeMap.push({ start: offset, end: offset + text.length, node: n });
    parts.push(text);
    offset += text.length;
  }
  return { flat: parts.join(''), nodeMap: nodeMap };
}

// Find all matches of (lowercased) `q` in flat text. Returns an array
// of matches; each match is an array of Ranges (>1 when the match
// spans multiple text nodes). Capped at SEARCH_MATCH_CAP; the
// returned `cappedAt` indicates whether more existed beyond the cap.
function findMatches(index, q) {
  var matches = [];
  if (!q) return { matches: matches, cappedAt: false };
  var lower = index.flat.toLowerCase();
  var qLower = q.toLowerCase();
  var qlen = qLower.length;
  var cap = SEARCH_MATCH_CAP + 1;  // +1 so we can detect overflow
  var pos = 0;
  while (true) {
    var idx = lower.indexOf(qLower, pos);
    if (idx < 0) break;
    var matchStart = idx;
    var matchEnd = idx + qlen;
    var ranges = rangesForSpan(index.nodeMap, matchStart, matchEnd);
    if (ranges.length > 0) matches.push(ranges);
    pos = matchEnd;
    if (matches.length >= cap) break;
  }
  var cappedAt = matches.length > SEARCH_MATCH_CAP;
  if (cappedAt) matches.length = SEARCH_MATCH_CAP;
  return { matches: matches, cappedAt: cappedAt };
}

// For a flat-text span [matchStart, matchEnd), build one Range per
// covered text-node fragment. surroundContents-friendly: each range is
// within a single text node.
function rangesForSpan(nodeMap, matchStart, matchEnd) {
  var ranges = [];
  for (var i = 0; i < nodeMap.length; i++) {
    var entry = nodeMap[i];
    if (entry.end <= matchStart) continue;
    if (entry.start >= matchEnd) break;
    var startOffset = Math.max(0, matchStart - entry.start);
    var endOffset = Math.min(entry.end - entry.start, matchEnd - entry.start);
    if (endOffset <= startOffset) continue;
    var r = document.createRange();
    try {
      r.setStart(entry.node, startOffset);
      r.setEnd(entry.node, endOffset);
      ranges.push(r);
    } catch (_) {}
  }
  return ranges;
}

// Wrap each range with a <mark class="search-match" data-match-idx="N">.
// Returns array of arrays-of-mark-elements (one outer entry per logical match).
function applyMarks(matches) {
  var allMarkGroups = [];
  for (var i = 0; i < matches.length; i++) {
    var ranges = matches[i];
    var marks = [];
    for (var r = 0; r < ranges.length; r++) {
      var range = ranges[r];
      try {
        var mark = document.createElement('mark');
        mark.className = 'search-match';
        mark.setAttribute('data-match-idx', String(i));
        range.surroundContents(mark);
        marks.push(mark);
      } catch (_) {
        // Range crosses element boundaries — surroundContents threw.
        // We chunked per text-node in rangesForSpan so this shouldn't
        // happen, but be defensive.
      }
    }
    allMarkGroups.push(marks);
  }
  // Source-mode gutter dots: any .source-line containing a search-match
  // gets the .has-search-match class.
  var lines = document.querySelectorAll('.source-line');
  for (var li = 0; li < lines.length; li++) {
    if (lines[li].querySelector('mark.search-match')) {
      lines[li].classList.add('has-search-match');
    }
  }
  return allMarkGroups;
}

function setCurrentMatchIdx(newIdx, total) {
  if (total === 0) {
    _searchCurrentIdx = -1;
    updateSearchCounter(0, 0);
    return;
  }
  // Wrap around
  var wrapped = ((newIdx % total) + total) % total;
  _searchCurrentIdx = wrapped;
  // Remove .current from all, add to the new match group
  var allMarks = document.querySelectorAll('mark.search-match');
  for (var i = 0; i < allMarks.length; i++) allMarks[i].classList.remove('current');
  var currentMarks = document.querySelectorAll('mark.search-match[data-match-idx="' + wrapped + '"]');
  for (var j = 0; j < currentMarks.length; j++) currentMarks[j].classList.add('current');
  // Scroll the first mark of the current match into view
  if (currentMarks.length > 0 && currentMarks[0].scrollIntoView) {
    currentMarks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  updateSearchCounter(wrapped + 1, total);
}

function runSearch(query) {
  clearSearchMarks();
  _searchMatchCount = 0;
  _searchCapped = false;
  _searchCurrentIdx = -1;
  if (!query) {
    updateSearchCounter(0, 0);
    return;
  }
  var index = buildFlatTextIndex();
  var result = findMatches(index, query);
  applyMarks(result.matches);
  _searchMatchCount = result.matches.length;
  _searchCapped = result.cappedAt;
  if (_searchCapped) {
    updateSearchCounter(0, SEARCH_MATCH_CAP + 1);  // triggers the "1000+ matches" branch
    return;
  }
  setCurrentMatchIdx(0, result.matches.length);
}

function navigateSearch(delta) {
  if (_searchMatchCount === 0 || _searchCapped) return;
  setCurrentMatchIdx(_searchCurrentIdx + delta, _searchMatchCount);
}

// Wire the search-bar buttons + input handler. Called once at startup.
function wireSearchBar() {
  var input = document.getElementById('search-input');
  var prev = document.getElementById('search-prev');
  var next = document.getElementById('search-next');
  var close = document.getElementById('search-close');
  if (!input || !prev || !next || !close) return;

  input.addEventListener('input', function() {
    if (_searchDebounceTimer) clearTimeout(_searchDebounceTimer);
    var q = input.value;
    _searchDebounceTimer = setTimeout(function() {
      _searchDebounceTimer = null;
      runSearch(q);
    }, SEARCH_DEBOUNCE_MS);
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeSearch();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      navigateSearch(e.shiftKey ? -1 : 1);
    }
  });
  prev.addEventListener('click', function() { navigateSearch(-1); });
  next.addEventListener('click', function() { navigateSearch(1); });
  close.addEventListener('click', closeSearch);
}

function rebuildSidebar() {
  var sidebar = document.getElementById('sidebar');
  sidebar.replaceChildren();
  // #99: replaces the previous "tabs and kebab share one scroller" layout.
  // Outer .sidebar is the flex row; inner .sidebar-tabs owns overflow so the
  // kebab (appended below as a sibling) stays pinned right.
  var tabsContainer = document.createElement('div');
  tabsContainer.className = 'sidebar-tabs';
  sidebar.appendChild(tabsContainer);
  for (var i = documents.length - 1; i >= 0; i--) {
    var tab = document.createElement('div');
    tab.className = 'doc-tab' + (i === activeIndex ? ' active' : '');
    tab.setAttribute('data-index', String(i));

    var titleEl = document.createElement('span');
    titleEl.className = 'tab-title';
    titleEl.textContent = documents[i].title || ('Doc ' + (i + 1));
    tab.appendChild(titleEl);

    var closeEl = document.createElement('span');
    closeEl.className = 'tab-close';
    closeEl.setAttribute('aria-label', 'Close tab');
    var closeSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    closeSvg.setAttribute('viewBox', '0 0 24 24');
    var p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p1.setAttribute('d', 'M18 6 6 18');
    var p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p2.setAttribute('d', 'm6 6 12 12');
    closeSvg.appendChild(p1);
    closeSvg.appendChild(p2);
    closeEl.appendChild(closeSvg);
    closeEl.addEventListener('click', function(e) {
      e.stopPropagation();
      var idx = Number(this.parentNode.getAttribute('data-index'));
      promptCloseTab(idx);
    });
    tab.appendChild(closeEl);

    titleEl.addEventListener('click', function() {
      showDocument(Number(this.parentNode.getAttribute('data-index')));
    });
    tabsContainer.appendChild(tab);
  }
  // Kebab menu (⋮) at the right edge of the strip. Frees up
  // horizontal space for file tabs vs the previous side-by-side
  // find/export buttons. Items: Find in file, Send as attachment.
  // Only rendered when at least one doc is open (matches the
  // .sidebar:empty {display:none} behavior).
  if (documents.length > 0) {
    var kebabBtn = document.createElement('button');
    kebabBtn.className = 'kebab-btn';
    kebabBtn.id = 'kebab-btn';
    kebabBtn.type = 'button';
    kebabBtn.title = 'More actions';
    kebabBtn.setAttribute('aria-label', 'More actions');
    kebabBtn.setAttribute('aria-haspopup', 'menu');
    kebabBtn.setAttribute('aria-expanded', 'false');
    kebabBtn.textContent = '⋮';  // ⋮ (vertical ellipsis)
    kebabBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleKebabMenu();
    });
    sidebar.appendChild(kebabBtn);
  }
  // Replaces the old `.sidebar:empty { display: none }` rule — the outer
  // .sidebar now always contains the inner .sidebar-tabs div, so :empty
  // never fires. Hide explicitly when no docs are open.
  sidebar.style.display = documents.length === 0 ? 'none' : '';
}

var pendingCloseIndex = -1;
function promptCloseTab(index) {
  if (index < 0 || index >= documents.length) return;
  pendingCloseIndex = index;
  var title = documents[index].title || ('Doc ' + (index + 1));
  document.getElementById('close-dialog-body').textContent =
    'Any unsent comments on "' + title + '" will be discarded.';
  document.getElementById('close-dialog').classList.add('visible');
}
function hideCloseDialog() {
  pendingCloseIndex = -1;
  document.getElementById('close-dialog').classList.remove('visible');
}
function confirmCloseTab() {
  var index = pendingCloseIndex;
  if (index < 0 || index >= documents.length) { hideCloseDialog(); return; }
  var doc = documents[index];
  var title = doc.title || '';

  // Tell the server so the dispatcher's session map drops the doc too.
  // Server-side handler must NOT touch the filesystem — pure in-memory removal.
  window.webxdc.sendUpdate({
    payload: {
      type: 'close_tab',
      docIndex: index,
      title: title,
      senderAddr: window.webxdc.selfAddr,
    },
    summary: 'closed tab: ' + title,
  }, 'closed tab');

  // Local removal: drop the doc, drop its comments, fix activeIndex.
  documents.splice(index, 1);
  if (commentsByDoc[index]) delete commentsByDoc[index];
  // Re-key comments for docs whose index shifted down.
  var rekeyed = {};
  for (var k in commentsByDoc) {
    var oldIdx = Number(k);
    if (oldIdx > index) rekeyed[oldIdx - 1] = commentsByDoc[k];
    else rekeyed[oldIdx] = commentsByDoc[k];
  }
  commentsByDoc = rekeyed;
  persistFrCacheNow();

  if (documents.length === 0) {
    activeIndex = -1;
    document.getElementById('content').replaceChildren();
    document.getElementById('content').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
  } else {
    var newIndex = Math.min(index, documents.length - 1);
    activeIndex = newIndex;
    showDocument(newIndex);
  }
  rebuildSidebar();
  hideCloseDialog();
}
// #77: wire the search bar's button + input handlers at boot.
wireSearchBar();
// Kebab menu's items + outside-click + Esc handlers.
wireKebabMenu();
document.getElementById('close-dialog-cancel').addEventListener('click', hideCloseDialog);
document.getElementById('close-dialog-confirm').addEventListener('click', confirmCloseTab);

// #112: remove the document at `index`, keeping commentsByDoc and
// activeIndex consistent. Display state is fixed up by refreshAfterRemoval
// once all matching docs are gone (a chunked file spans several entries
// that share one fileId).
function removeDocumentAt(index) {
  documents.splice(index, 1);
  if (commentsByDoc[index]) delete commentsByDoc[index];
  var rekeyed = {};
  for (var k in commentsByDoc) {
    var oldIdx = Number(k);
    if (oldIdx > index) rekeyed[oldIdx - 1] = commentsByDoc[k];
    else rekeyed[oldIdx] = commentsByDoc[k];
  }
  commentsByDoc = rekeyed;
  if (activeIndex === index) activeIndex = -1;
  else if (activeIndex > index) activeIndex -= 1;
}

// #113: cap total cached documents at FR_MAX_DOCS. Evicts the oldest
// (index 0, since new docs are always appended) until back at the cap,
// then shows exactly one toast summarizing the evictions for that batch —
// not one per file.
function enforceDocCap() {
  var evicted = 0;
  while (documents.length > FR_MAX_DOCS) {
    removeDocumentAt(0);
    evicted++;
  }
  if (evicted > 0) {
    var noun = evicted === 1 ? 'file' : 'files';
    showExportToast('success', evicted + ' older ' + noun + ' removed to stay under the ' + FR_MAX_DOCS + '-file limit.');
  }
}

// #112: reconcile the visible view after one or more removals.
function refreshAfterRemoval() {
  if (documents.length === 0) {
    activeIndex = -1;
    var c = document.getElementById('content');
    if (c) { c.replaceChildren(); c.style.display = 'none'; }
    var l = document.getElementById('loading');
    if (l) l.style.display = 'none';
    var e = document.getElementById('empty');
    if (e) e.style.display = 'flex';
    var b = document.getElementById('bottombar');
    if (b) b.style.display = 'none';
  } else {
    if (activeIndex < 0) activeIndex = 0;
    if (activeIndex > documents.length - 1) activeIndex = documents.length - 1;
    showDocument(activeIndex);
    if (typeof updateBottomBar === 'function') updateBottomBar();
  }
  rebuildSidebar();
}

// #112: record that a file's comments were sent and drop it from the view
// if it's loaded. Runs for both replayed comments (reopen) and the live
// echo of our own send — idempotent, so double-handling is harmless.
function markCommentsSent(fileId, fileTitle) {
  if (fileId) sentFileIds[fileId] = true;
  else if (fileTitle) sentTitles[fileTitle] = true;
  var removedAny = false;
  for (var i = documents.length - 1; i >= 0; i--) {
    var d = documents[i];
    var match = fileId ? (d.fileId === fileId) : (!!fileTitle && d.title === fileTitle);
    if (match) { removeDocumentAt(i); removedAny = true; }
  }
  if (removedAny) refreshAfterRemoval();
}

// #113: restore from cache before registering the listener, so a valid
// cache renders instantly and the listener resumes past what it already
// processed instead of replaying from 0.
var frCache = loadFrCache();
var frInitialSerial = 0;
if (frCache) {
  restoreFrCache(frCache);
  frLastSerial = frCache.lastSerial;
  frInitialSerial = frCache.lastSerial;
  document.getElementById('loading').style.display = 'none';
  if (documents.length) {
    document.getElementById('empty').style.display = 'none';
    rebuildSidebar();
    showTargetDocument();
  } else {
    document.getElementById('empty').style.display = 'flex';
  }
}

function handleFrUpdate(update) {
  var data = update.payload;
  if (!data) return;
  if (versionMismatchSent) return;

  // #78: export-as-attachment result (success or failure). Handled
  // before the version-upgrade gate because it's a server-emitted
  // status update unrelated to document delivery.
  if (data.type === 'export-result') {
    handleExportResult(data);
    return;
  }
  // #78: outbound 'export-file' payloads echo to our own listener via
  // WebXDC's standard sendUpdate replay. They have a 'content' field
  // which would otherwise match the legacy single-chunk fallback below
  // and create a duplicate "Untitled" tab. Drop early — nothing to do
  // with an export request on the receive side.
  if (data.type === 'export-file') return;

  // #112: a 'comments' update means this file's review was already sent.
  // On reopen it replays right after the file's 'document' update, so drop
  // the file to keep sent state across reloads. Handled before the version
  // gate (it's a status update, not document delivery, and carries no
  // version field).
  if (data.type === 'comments') {
    markCommentsSent(data.fileId || null, data.fileTitle || null);
    return;
  }

  // Auto-upgrade: if server version is newer, request fresh app
  if (data.version && data.version > APP_VERSION && !versionMismatchSent) {
    versionMismatchSent = true;
    window.webxdc.sendUpdate({
      payload: { type: 'version_mismatch', appVersion: APP_VERSION, serverVersion: data.version, senderAddr: window.webxdc.selfAddr },
    }, 'version mismatch');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'none';
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('bottombar').style.display = 'none';
    document.getElementById('outdated').style.display = 'flex';
    return;
  }

  // Bundled-document path (1.39+): one update carries all chunks of a
  // single document. Each chunk preserves its own startLine so comment
  // routing still maps to absolute line numbers.
  if (data.type === 'document' && Array.isArray(data.chunks)) {
    // #112: skip a file whose comments already replayed (defensive — on a
    // normal reopen the document replays before its comments, but guard the
    // reverse ordering too).
    if (data.fileId && sentFileIds[data.fileId]) return;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty').style.display = 'none';
    var firstNewIndex = documents.length;
    for (var i = 0; i < data.chunks.length; i++) {
      var c = data.chunks[i];
      var chunkContent = c.content || c.markdown;
      if (!chunkContent) continue;
      // #113: idempotent insert — a crash between "applied" and "persisted"
      // can redeliver this same update on next boot. Dedup by fileId+title
      // together (never fileId alone — a multi-chunk file shares one fileId
      // across several distinctly-titled chunks, and deduping on fileId
      // alone would keep only the first chunk).
      var chunkTitle = c.title || 'Untitled';
      var chunkAlreadyHave = documents.some(function (d) {
        return d.fileId === (data.fileId || null) && d.title === chunkTitle;
      });
      if (chunkAlreadyHave) continue;
      documents.push({
        title: chunkTitle,
        content: chunkContent,
        language: c.language || data.language || null,
        startLine: c.startLine || 1,
        // #73 + #78: every chunk shares the file-level fileId. #73 deep-
        // links via the URL fragment (which matches chunk 0's notification
        // anchor); #78's export-as-attachment assembler groups chunks of
        // the same logical file by fileId.
        fileId: data.fileId || null,
      });
    }
    var hadNewChunks = documents.length > firstNewIndex;
    enforceDocCap();
    rebuildSidebar();
    if (hadNewChunks) showTargetDocument();
    return;
  }

  // Legacy single-chunk path: old payloads have 'markdown' field
  var content = data.content || data.markdown;
  if (!content) return;
  // #112: skip a file already marked reviewed (see bundled path above).
  if ((data.fileId && sentFileIds[data.fileId]) ||
      (!data.fileId && data.title && sentTitles[data.title])) return;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('empty').style.display = 'none';

  var legacyTitle = data.title || 'Untitled';
  var legacyAlreadyHave = documents.some(function (d) {
    return d.fileId === (data.fileId || null) && d.title === legacyTitle;
  });
  if (!legacyAlreadyHave) {
    documents.push({
      title: legacyTitle,
      content: content,
      language: data.language || null,
      startLine: data.startLine || 1,
      // #73: chunked-fallback path puts fileId on chunk 0 only; legacy
      // pre-1.42 payloads have no fileId and fall through to "show last."
      fileId: data.fileId || null,
    });
  }

  enforceDocCap();
  rebuildSidebar();
  showTargetDocument();
}

window.webxdc.setUpdateListener(function(update) {
  handleFrUpdate(update);
  frLastSerial = update.serial;
  persistFrCache();
}, frInitialSerial);

// #73: deep-link to a specific file via the URL fragment carried in the
// notification's href. Spec example: `index.html#about`; we use
// `index.html#file-<fileId>`. Hash always wins — no race-prone
// "initial replay done" flag. Trade-off: a new file arriving while
// you're viewing an older one won't auto-jump (navigate via sidebar).
function showTargetDocument() {
  var m = (window.location.hash || '').match(/^#file-(.+)$/);
  if (m) {
    var target = decodeURIComponent(m[1]);
    for (var i = 0; i < documents.length; i++) {
      if (documents[i].fileId === target) { showDocument(i); return; }
    }
    // Hash present but no doc matches yet — wait for the doc to arrive
    // in a subsequent update (the hashchange or next showTargetDocument
    // call will retry).
    return;
  }
  if (documents.length > 0) showDocument(documents.length - 1);
}

// Notification tapped while app is already open: DC swaps the URL
// fragment without reloading the page.
window.addEventListener('hashchange', function () { showTargetDocument(); });
</script>
</body>
</html>
