<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="webxdc.js"></script>
<style>
:root {
  --bg:        #0B0F17;
  --surface:   #131826;
  --surface-2: #1A2030;
  --surface-3: #232A3C;
  --line:      #2C3447;
  --line-soft: #1F2536;
  --ink:       #E8ECF5;
  --ink-mute:  #99A2B8;
  --ink-faint: #6C748A;
  --paper:     #FAF9F5;
  --orange:    #D97757;
  --green:     #3DA85A;
  --amber:     #C99A35;
  --amber-soft: rgba(201,154,53,0.14);
  --danger:    #E5694C;
  --danger-soft: rgba(229,105,76,0.14);
  --green-soft: rgba(61,168,90,0.14);
  --radius:    14px;
  --radius-sm: 10px;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 14px/1.45 var(--font-sans);
  letter-spacing: 0.005em;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 20px 14px;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.card-head {
  padding: 18px 18px 16px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  border-bottom: 1px solid var(--line-soft);
  flex-shrink: 0;
}
.gate-chip {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--amber-soft);
  border: 1px solid color-mix(in oklch, var(--amber) 40%, transparent);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.gate-chip svg {
  width: 20px; height: 20px;
  stroke: var(--amber);
  stroke-width: 1.75;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.head-text { flex: 1; min-width: 0; }
.head-meta {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--amber);
}
.head-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: var(--ink);
  margin-top: 4px;
  word-break: break-word;
}
.head-title .tool {
  font-family: var(--font-mono);
  font-size: 14px;
  background: var(--surface-3);
  color: var(--ink);
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  margin-left: 2px;
  letter-spacing: 0;
  white-space: nowrap;
  display: inline-block;
  vertical-align: baseline;
}
.card-body {
  padding: 16px 18px 8px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.field-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  margin-bottom: 7px;
  flex-shrink: 0;
}
.description {
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-mute);
  flex-shrink: 0;
  max-height: 4.5em;
  overflow: hidden;
  position: relative;
}
.description.expanded {
  max-height: 200px;
  overflow-y: auto;
}
.description.truncated:not(.expanded)::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 1.5em;
  background: linear-gradient(transparent, var(--surface));
  pointer-events: none;
}
.show-toggle {
  display: none;
  margin-top: 6px;
  font-size: 12px;
  color: var(--orange);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  padding: 0 0 4px;
  flex-shrink: 0;
}
.show-toggle.visible { display: inline-block; }
.preview {
  margin-top: 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--paper);
  white-space: pre-wrap;
  word-break: break-all;
  flex: 1;
  min-height: 120px;
  overflow-y: auto;
}
.preview .k {
  color: var(--orange);
  font-weight: 500;
}
.preview .s { color: #A9C5F0; }
.preview .n { color: var(--amber); }
.preview .row { margin-bottom: 10px; }
.preview .row:last-child { margin-bottom: 0; }
.preview .block {
  display: block;
  margin-top: 6px;
  padding: 9px 11px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  color: var(--paper);
  word-break: break-word;
}
.card-actions {
  display: flex;
  gap: 10px;
  padding: 14px 18px 18px;
  border-top: 1px solid var(--line-soft);
  margin-top: auto;
  flex-shrink: 0;
}
.btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font: 500 14px/1 var(--font-sans);
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.08s, opacity 0.15s;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.35; cursor: default; transform: none; }
.btn svg {
  width: 16px; height: 16px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn-deny {
  background: var(--surface-2);
  color: var(--ink);
}
.btn-deny:hover:not(:disabled) {
  background: var(--danger-soft);
  border-color: color-mix(in oklch, var(--danger) 50%, transparent);
  color: var(--danger);
}
.btn-allow {
  background: var(--orange);
  color: var(--paper);
  border-color: color-mix(in oklch, var(--orange) 65%, #000);
  font-weight: 600;
}
.btn-allow:hover:not(:disabled) {
  background: color-mix(in oklch, var(--orange) 92%, #000);
}

#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 60px 20px;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.02em;
  margin: auto;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--line);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#outdated {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 44px 22px;
  margin: auto;
}
.outdated-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  margin-bottom: 14px;
}
.outdated-icon svg {
  width: 22px; height: 22px;
  stroke: var(--ink-mute);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.outdated-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.outdated-sub {
  font-size: 12px;
  color: var(--ink-mute);
  margin-top: 6px;
  line-height: 1.5;
}

#result {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 32px 22px 22px;
}
.result-dot {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  margin-bottom: 16px;
}
.result-dot svg {
  width: 22px; height: 22px;
  fill: none;
  stroke-width: 2.25;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#result.ok .result-dot {
  background: var(--green-soft);
  border: 1px solid color-mix(in oklch, var(--green) 50%, transparent);
}
#result.ok .result-dot svg { stroke: var(--green); }
#result.no .result-dot {
  background: var(--danger-soft);
  border: 1px solid color-mix(in oklch, var(--danger) 50%, transparent);
}
#result.no .result-dot svg { stroke: var(--danger); }
.result-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.result-sub {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-mute);
  margin-top: 4px;
  word-break: break-word;
}
.result-hint {
  margin-top: 18px;
  padding: 10px 12px;
  font-size: 11px;
  color: var(--ink-mute);
  background: var(--surface-2);
  border: 1px dashed var(--line);
  border-radius: var(--radius-sm);
  line-height: 1.55;
  text-align: left;
  width: 100%;
}
.result-hint b { color: var(--ink); font-weight: 600; }
.result-hint a {
  color: var(--orange);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 1px dashed color-mix(in oklch, var(--orange) 55%, transparent);
}
.result-hint a:active { opacity: 0.7; }
.result-hint a.summoning { color: var(--ink-faint); border-bottom-color: transparent; cursor: default; }
.result-hint a.summoned { color: var(--green); border-bottom-color: transparent; cursor: default; }
.back-hint {
  margin-top: 14px;
  font-size: 12px;
  color: var(--ink-faint);
  display: inline-flex;
  gap: 6px;
  align-items: center;
}

#prompt { display: none; }
#prompt.visible { display: flex; }
#outdated.visible { display: flex; }
#result.visible { display: flex; }
.check-icon,
.x-icon { display: none; }
#result.ok .check-icon { display: block; }
#result.no .x-icon { display: block; }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>Waiting for permission details&hellip;</div>
</div>
<div id="outdated">
  <div class="outdated-icon">
    <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </div>
  <div class="outdated-title">New version available</div>
  <div class="outdated-sub">A newer permission card was sent to this chat. Swipe back and open the latest one.</div>
</div>
<div id="prompt" class="card">
  <div class="card-head">
    <div class="gate-chip" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
    </div>
    <div class="head-text">
      <div class="head-meta">Permission gate</div>
      <div class="head-title">Claude is about to run <span id="tool" class="tool"></span></div>
    </div>
  </div>
  <div class="card-body">
    <div class="field-label">What it&rsquo;ll do</div>
    <div id="desc" class="description"></div>
    <button id="desc-toggle" class="show-toggle" onclick="toggleDesc()">Show more</button>
    <div class="field-label" style="margin-top:16px">Parameters</div>
    <div id="preview" class="preview"></div>
  </div>
  <div id="actions" class="card-actions">
    <button class="btn btn-deny" onclick="respond(false)">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      Deny
    </button>
    <button class="btn btn-allow" onclick="respond(true)">
      <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      Allow
    </button>
  </div>
  <div id="result">
    <div class="result-dot">
      <svg class="check-icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      <svg class="x-icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>
    <div id="result-text" class="result-title"></div>
    <div id="result-sub" class="result-sub"></div>
  </div>
</div>
<script>
var APP_VERSION = 2.02;
// Map of requestId -> {data, resolved}
var requests = {};
// Whether initial replay has finished
var initialReplayDone = false;
// Guard against double-tap on Allow/Deny
var responding = false;
// Whether we've already sent a version_mismatch update
var versionMismatchSent = false;

var previewBox = document.getElementById('preview');

// Render tool params as "key: value" rows, dropping outer braces and
// unescaping \n in string values. Multi-line strings become indented
// blocks. Nested objects/arrays fall back to pretty JSON.
function renderPreview(raw) {
  while (previewBox.firstChild) previewBox.removeChild(previewBox.firstChild);

  var parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    previewBox.appendChild(document.createTextNode(String(raw)));
    return;
  }

  if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
    previewBox.appendChild(document.createTextNode(JSON.stringify(parsed, null, 2)));
    return;
  }

  function span(cls, value) {
    var s = document.createElement('span');
    s.className = cls;
    s.textContent = value;
    return s;
  }

  var keys = Object.keys(parsed);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var v = parsed[k];
    var row = document.createElement('div');
    row.className = 'row';
    row.appendChild(span('k', k));

    if (typeof v === 'string') {
      if (v.indexOf('\n') !== -1) {
        var block = document.createElement('div');
        block.className = 'block';
        block.textContent = v;
        row.appendChild(block);
      } else {
        row.appendChild(document.createTextNode(': '));
        row.appendChild(span('s', v));
      }
    } else if (typeof v === 'number' || typeof v === 'boolean' || v === null) {
      row.appendChild(document.createTextNode(': '));
      row.appendChild(span('n', String(v)));
    } else {
      var block = document.createElement('div');
      block.className = 'block';
      block.textContent = JSON.stringify(v, null, 2);
      row.appendChild(block);
    }

    previewBox.appendChild(row);
  }
}

function showRequest(data) {
  responding = false;

  // Re-enable Allow/Deny after a prior respond() left them disabled
  var btns = document.querySelectorAll('.btn');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = false;

  // Drop hint divs appended by a prior respond() so they don't accumulate
  var r = document.getElementById('result');
  var hints = r.querySelectorAll('.back-hint, .result-hint');
  for (var j = 0; j < hints.length; j++) r.removeChild(hints[j]);
  r.classList.remove('ok', 'no', 'visible');

  document.getElementById('tool').textContent = data.toolName || 'unknown';
  var descEl = document.getElementById('desc');
  var toggleEl = document.getElementById('desc-toggle');
  descEl.textContent = data.description || '';
  descEl.classList.remove('expanded');
  toggleEl.textContent = 'Show more';
  // Detect overflow on next frame
  setTimeout(function() {
    if (descEl.scrollHeight > descEl.clientHeight + 2) {
      descEl.classList.add('truncated');
      toggleEl.classList.add('visible');
    } else {
      descEl.classList.remove('truncated');
      toggleEl.classList.remove('visible');
    }
  }, 0);

  renderPreview(data.inputPreview || '');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('outdated').classList.remove('visible');
  document.getElementById('actions').style.display = 'flex';
  document.getElementById('prompt').classList.add('visible');

  // Store the active request id for respond()
  document.getElementById('prompt').dataset.requestId = data.requestId;
}

function showLoading() {
  document.getElementById('outdated').classList.remove('visible');
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('prompt').classList.remove('visible');
}

function resolveInitialView() {
  initialReplayDone = true;
  if (versionMismatchSent) return;

  // Prefer the hash target if it's unresolved
  var hash = location.hash.replace('#', '');
  if (hash && requests[hash] && !requests[hash].resolved) {
    showRequest(requests[hash].data);
    return;
  }

  // Fall back to the first unresolved request
  for (var id in requests) {
    if (!requests[id].resolved) {
      showRequest(requests[id].data);
      return;
    }
  }

  // Nothing pending — keep the loading screen
  showLoading();
}

window.webxdc.setUpdateListener(function(update) {
  var d = update.payload;
  if (!d) return;

  if (d.type === 'request') {
    // Check version — if server is newer, request an upgrade
    if (d.version && d.version > APP_VERSION && !versionMismatchSent) {
      versionMismatchSent = true;
      console.log('version mismatch: app=' + APP_VERSION + ' server=' + d.version);
      window.webxdc.sendUpdate({
        payload: { type: 'version_mismatch', appVersion: APP_VERSION, serverVersion: d.version, senderAddr: window.webxdc.selfAddr },
        summary: 'Update requested'
      }, 'Version mismatch — requesting update');
      document.getElementById('loading').style.display = 'none';
      document.getElementById('prompt').classList.remove('visible');
      document.getElementById('outdated').classList.add('visible');
      return;
    }

    // Don't overwrite a resolved entry — treat each requestId as immutable once set
    if (!requests[d.requestId]) {
      requests[d.requestId] = { data: d, resolved: false };
    }
    // If we're past initial replay, this is a live update — navigate immediately
    if (initialReplayDone && !requests[d.requestId].resolved) {
      showRequest(d);
    }
  }

  if (d.type === 'response') {
    if (requests[d.requestId]) {
      requests[d.requestId].resolved = true;
    }
  }
}, 0);

// Defer initial navigation until after synchronous replay completes
setTimeout(resolveInitialView, 0);

function toggleDesc() {
  var descEl = document.getElementById('desc');
  var toggleEl = document.getElementById('desc-toggle');
  var expanded = descEl.classList.toggle('expanded');
  toggleEl.textContent = expanded ? 'Show less' : 'Show more';
}

function summonAgentSettings(e) {
  var a = e.currentTarget;
  if (a.classList.contains('summoning') || a.classList.contains('summoned')) return;
  a.classList.add('summoning');
  a.textContent = 'Sending card\u2026';
  window.webxdc.sendUpdate({
    payload: {
      type: 'open_agent_settings',
      senderAddr: window.webxdc.selfAddr,
      senderName: window.webxdc.selfName
    },
    summary: 'Open Agent settings'
  }, 'Agent settings requested');
  // Flip to a confirmed state shortly — the dispatcher will send a card
  // into the chat; the user swipes back to see it. This is fire-and-forget.
  setTimeout(function() {
    a.classList.remove('summoning');
    a.classList.add('summoned');
    a.textContent = 'Card sent \u2014 check chat';
  }, 600);
}

function respond(granted) {
  if (responding) return;
  var requestId = document.getElementById('prompt').dataset.requestId;
  if (!requestId || !requests[requestId] || requests[requestId].resolved) return;

  responding = true;
  var btns = document.querySelectorAll('.btn');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

  window.webxdc.sendUpdate({
    payload: {
      type: 'response',
      requestId: requestId,
      granted: granted,
      senderAddr: window.webxdc.selfAddr,
      senderName: window.webxdc.selfName
    },
    summary: granted ? '\u2713 Allowed' : '\u00d7 Denied'
  }, granted ? 'Allowed' : 'Denied');

  requests[requestId].resolved = true;

  document.getElementById('actions').style.display = 'none';
  var r = document.getElementById('result');
  r.classList.add('visible');
  r.classList.add(granted ? 'ok' : 'no');
  document.getElementById('result-text').textContent = granted ? 'Allowed' : 'Denied';
  document.getElementById('result-sub').textContent = requests[requestId].data.toolName || '';

  // Trusted-agent hint — only on Allow (the one next-step action)
  if (granted) {
    var hint = document.createElement('div');
    hint.className = 'result-hint';
    var b = document.createElement('b');
    b.textContent = 'Want to skip this next time? ';
    hint.appendChild(b);
    hint.appendChild(document.createTextNode('Mark this agent as trusted in the '));
    var a = document.createElement('a');
    a.textContent = 'Agent settings app';
    a.setAttribute('role', 'button');
    a.setAttribute('tabindex', '0');
    a.addEventListener('click', summonAgentSettings);
    hint.appendChild(a);
    hint.appendChild(document.createTextNode('. Trusted agents auto-approve tools and log every decision to an audit trail.'));
    r.appendChild(hint);
  }

  var back = document.createElement('div');
  back.className = 'back-hint';
  back.textContent = '\u2190 Swipe back to return to chat';
  r.appendChild(back);
}
</script>
</body>
</html>
