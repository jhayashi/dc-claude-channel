<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="webxdc.js"></script>
<style>
:root {
  --bg:        #0B0F17;
  --surface:   #131826;
  --surface-2: #1A2030;
  --surface-3: #232A3C;
  --line:      #2C3447;
  --line-soft: #1F2536;
  --ink:       #E8ECF5;
  --ink-mute:  #99A2B8;
  --ink-faint: #6C748A;
  --paper:     #FAF9F5;
  --orange:    #D97757;
  --green:     #3DA85A;
  --amber:     #C99A35;
  --danger:    #E5694C;
  --orange-soft: rgba(217,119,87,0.14);
  --danger-soft: rgba(229,105,76,0.14);
  --radius:    14px;
  --radius-sm: 10px;
  --font-sans: ui-sans-serif, system-ui, -apple-system, Inter, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink-mute);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.sidebar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--line-soft);
  padding: 8px 8px 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex-shrink: 0;
}
.sidebar:empty { display: none; }
.doc-tab {
  position: relative;
  padding: 8px 10px 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  color: var(--ink-faint);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
}
.doc-tab.active {
  background: var(--bg);
  color: var(--ink);
  font-weight: 500;
}
.doc-tab.active::after {
  content: '';
  position: absolute;
  left: 12px; right: 12px; bottom: 0;
  height: 2px;
  background: var(--orange);
  border-radius: 1px;
}
.doc-tab .tab-title {
  display: inline-block;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.doc-tab .tab-close {
  width: 16px;
  height: 16px;
  display: inline-grid;
  place-items: center;
  color: var(--ink-faint);
  flex-shrink: 0;
  cursor: pointer;
  transition: color 120ms ease;
}
.doc-tab .tab-close svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.doc-tab .tab-close:hover, .doc-tab .tab-close:active {
  color: var(--danger);
}
/* Confirm dialog */
.dialog-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.dialog-overlay.visible { display: flex; }
.dialog {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  max-width: 320px;
  width: 100%;
  color: var(--ink);
}
.dialog-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
.dialog-body { font-size: 13px; color: var(--ink-mute); margin-bottom: 16px; word-break: break-word; line-height: 1.5; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
.dialog-btn {
  padding: 8px 14px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}
.dialog-btn.cancel {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.dialog-btn.cancel:hover { border-color: color-mix(in oklch, var(--ink) 25%, var(--line)); }
.dialog-btn.confirm {
  background: var(--surface-2);
  color: var(--ink-mute);
  border-color: var(--line);
}
.dialog-btn.confirm:hover {
  color: var(--danger);
  border-color: color-mix(in oklch, var(--danger) 40%, var(--line));
}
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 60px 36px;
  line-height: 1.6;
}
/* Source view gets a tighter wrapper — the gutter + source-line padding
   already provide enough left whitespace. */
.content.source-mode {
  padding: 0 0 60px 0;
}
/* Markdown rendered styles */
.content h1 { font-size: 24px; font-weight: 700; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); color: var(--ink); }
.content h2 { font-size: 20px; font-weight: 600; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); color: var(--ink); }
.content h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; color: var(--ink); }
.content p { margin: 0 0 12px; color: var(--ink-mute); }
.content ul, .content ol { margin: 0 0 12px; padding-left: 24px; color: var(--ink-mute); }
.content li { margin: 4px 0; }
.content code {
  font-family: var(--font-mono);
  background: var(--surface-3);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
  font-size: 13px;
  color: var(--ink);
}
.content pre {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin: 0 0 12px;
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.5;
}
.content pre code { display: block; background: none; border: none; padding: 0; }
.content blockquote {
  border-left: 2px solid var(--orange);
  padding: 4px 16px;
  margin: 0 0 12px;
  color: var(--ink-mute);
  font-style: italic;
}
.content a {
  color: var(--orange);
  text-decoration: none;
  border-bottom: 1px dashed color-mix(in oklch, var(--orange) 55%, transparent);
}
.content hr { border: none; border-top: 1px solid var(--line-soft); margin: 16px 0; }
.content strong { color: var(--ink); }
.content em { color: var(--ink); }
.content table { border-collapse: collapse; margin: 0 0 12px; width: 100%; }
.content th, .content td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
.content th { background: var(--surface-2); font-weight: 600; color: var(--ink); }
.content del { color: var(--ink-faint); text-decoration: line-through; }
.content ol { padding-left: 24px; margin: 0 0 12px; }
.content ul { padding-left: 24px; margin: 0 0 12px; }
.content li { margin: 2px 0; }
.content li.task { list-style: none; margin-left: -20px; }
.content li.task .task-mark {
  display: inline-block;
  width: 22px;
  margin-right: 6px;
  font-size: 18px;
  vertical-align: middle;
}
.content li.task.done { color: var(--ink-faint); }
.content h4 { font-size: 16px; margin: 16px 0 8px; color: var(--ink); }
.content h5 { font-size: 14px; margin: 14px 0 6px; color: var(--ink); }
.content h6 { font-size: 13px; margin: 12px 0 6px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
/* Source view styles */
.source-view {
  padding: 0;
  overflow-x: auto;
}
.source-view pre {
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  border-radius: 0;
}
.source-view code {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.5;
  background: none;
  border: none;
  padding: 0;
}
/* Source lines — each line is a div for commenting */
.source-line {
  display: flex;
  padding: 0 14px 0 6px;
  min-height: 20px;
  user-select: none;
  -webkit-user-select: none;
}
.source-line .line-gutter {
  flex-shrink: 0;
  width: 14px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 11px;
  font-family: var(--font-mono);
  user-select: none;
  -webkit-user-select: none;
}
.source-line .line-content {
  flex: 1;
  white-space: pre;
  overflow-x: visible;
}
.source-line.commented {
  box-shadow: inset 2px 0 0 var(--orange);
}
.source-line .line-gutter {
  position: relative;
}
.source-line .comment-bubble {
  position: static;
  width: 14px;
  height: 14px;
  margin: 3px auto 0;
}
.source-line .comment-bubble svg {
  width: 12px;
  height: 12px;
}
/* Slide mode */
.slides-container {
  display: block;
  position: relative;
}
.slide {
  display: none;
}
.slide.active {
  display: block;
}
.slide-nav {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 8px 0 10px;
  margin-bottom: 8px;
  background: linear-gradient(to bottom, var(--bg) 70%, transparent);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  user-select: none;
}
.slide-nav-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  width: 28px;
  height: 28px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.slide-nav-btn:hover:not(:disabled) {
  border-color: var(--orange);
  color: var(--orange);
}
.slide-nav-btn:disabled {
  opacity: 0.4;
  cursor: default;
}
.slide-counter {
  min-width: 52px;
  text-align: center;
  letter-spacing: 0.04em;
}
.slide-dots {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
  max-width: 260px;
  justify-content: center;
}
.slide-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line);
  cursor: pointer;
  border: none;
  padding: 0;
}
.slide-dot.active {
  background: var(--orange);
}
/* Markdown block commenting */
.md-block {
  position: relative;
}
.md-block.commented::before,
.md-block-table.commented::before,
.md-block-list.commented::before,
.md-block-code.commented::before {
  content: '';
  position: absolute;
  left: -4px;
  top: 2px;
  bottom: 2px;
  width: 2px;
  background: var(--orange);
  border-radius: 1px;
}
.comment-bubble {
  position: absolute;
  left: -26px;
  top: 2px;
  width: 18px;
  height: 18px;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  border-radius: 6px;
  transition: background 120ms ease;
  z-index: 2;
  -webkit-tap-highlight-color: transparent;
}
.comment-bubble:hover, .comment-bubble:active {
  background: var(--orange-soft);
}
.comment-bubble svg {
  width: 14px;
  height: 14px;
  stroke: var(--orange);
  stroke-width: 1.75;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.comment-bubble .count-badge {
  position: absolute;
  top: -4px;
  right: -5px;
  min-width: 12px;
  height: 12px;
  padding: 0 3px;
  box-sizing: border-box;
  border-radius: 7px;
  background: var(--orange);
  color: var(--bg, #1f1f1f);
  font-size: 9px;
  font-weight: 700;
  line-height: 12px;
  text-align: center;
  font-family: var(--font-mono);
  letter-spacing: -0.02em;
  white-space: nowrap;
  box-shadow: 0 0 0 1.5px var(--bg, #1f1f1f);
  pointer-events: none;
}
.md-block-table > .comment-bubble {
  top: 14px;
}
.md-block-list > .comment-bubble {
  top: 4px;
}
.md-block-code > .comment-bubble {
  top: 18px;
}
.code-line {
  display: block;
  min-height: 1em;
  padding: 0;
  border-radius: 2px;
}
.comment-popover {
  position: fixed;
  z-index: 20;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.45);
  min-width: 220px;
  max-width: 320px;
  padding: 4px;
}
.comment-popover-item {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--ink);
  font-family: var(--font-sans, inherit);
  font-size: 13px;
}
.comment-popover-item:hover, .comment-popover-item:active {
  background: var(--surface-2);
}
.comment-popover-item .row-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  margin-bottom: 2px;
}
.comment-popover-item .comment-preview {
  color: var(--ink-mute);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}
/* Markdown tables */
.table-wrap {
  overflow-x: auto;
  margin: 12px 0;
  -webkit-overflow-scrolling: touch;
}
.md-block table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
.md-block th, .md-block td {
  border: 1px solid var(--line);
  padding: 6px 10px;
  text-align: left;
}
.md-block th {
  background: var(--surface-2);
  font-weight: 600;
  color: var(--ink);
}
.md-block tr:nth-child(even) td {
  background: rgba(255, 255, 255, 0.02);
}
/* Prism theme overrides for our dark bg
 * The shipped Prism palette (injected at %%PRISM_CSS%%) is preserved as-is;
 * only the enclosing canvas moves from #0e1117 to --bg. */
/* %%PRISM_CSS%% */
pre[class*="language-"] { background: var(--bg); }
:not(pre) > code[class*="language-"], pre[class*="language-"] { background: var(--bg); }
code[class*="language-"], pre[class*="language-"] { text-shadow: none; }
/* Loading */
#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.02em;
  gap: 12px;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--line);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#outdated, #empty {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 44px 22px;
  margin: auto;
  flex: 1;
  justify-content: center;
}
.outdated-icon, .empty-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  margin-bottom: 14px;
}
.outdated-icon svg, .empty-icon svg {
  width: 22px; height: 22px;
  stroke: var(--ink-mute);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.outdated-title, .empty-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.outdated-sub, .empty-sub {
  font-size: 12px;
  color: var(--ink-mute);
  margin-top: 6px;
  line-height: 1.5;
}
/* Bottom bar */
#bottombar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--line-soft);
  padding: 10px 16px;
  display: none;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  z-index: 100;
}
#bottombar .hint {
  color: var(--ink-faint);
  font-size: 12px;
}
#bottombar .comment-count {
  color: var(--ink);
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
#bottombar .comment-count::before {
  content: '';
  width: 14px;
  height: 14px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D97757' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/></svg>");
  background-size: contain;
  background-repeat: no-repeat;
  flex-shrink: 0;
}
#bottombar .send-btn {
  background: var(--orange);
  color: var(--paper);
  border: 1px solid var(--orange);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity 120ms ease;
}
#bottombar .send-btn:active { opacity: 0.85; }
#bottombar .send-btn::before {
  content: '';
  width: 14px;
  height: 14px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FAF9F5' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='m3 3 3 9-3 9 19-9Z'/><path d='M6 12h16'/></svg>");
  background-size: contain;
  background-repeat: no-repeat;
}
/* Comment input card */
#comment-card {
  display: none;
  position: fixed;
  left: 10px;
  right: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  z-index: 200;
  box-shadow: 0 4px 20px rgba(0,0,0,0.45);
}
#comment-card .target-chip {
  margin-bottom: 10px;
}
#comment-card .target-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
#comment-card .target-text {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink-mute);
  word-break: break-word;
}
#comment-card textarea {
  width: 100%;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  resize: vertical;
  min-height: 60px;
  max-height: 150px;
}
#comment-card textarea:focus {
  outline: none;
  border: 2px solid var(--orange);
  padding: 9px;
}
#comment-card .card-buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  justify-content: flex-end;
  align-items: center;
}
#comment-card .card-btn {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}
#comment-card .btn-save {
  background: var(--orange);
  color: var(--paper);
  border-color: var(--orange);
}
#comment-card .btn-save:active { opacity: 0.85; }
#comment-card .btn-cancel {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
#comment-card .btn-cancel:hover { border-color: color-mix(in oklch, var(--ink) 25%, var(--line)); }
#comment-card .btn-delete {
  background: var(--surface-2);
  color: var(--ink-mute);
  border-color: var(--line);
  margin-right: auto;
}
#comment-card .btn-delete:hover {
  color: var(--danger);
  border-color: color-mix(in oklch, var(--danger) 40%, var(--line));
}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>Loading document…</div>
</div>
<div id="empty">
  <div class="empty-icon">
    <svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h5"/><path d="M8 17h4"/></svg>
  </div>
  <div class="empty-title">No files open.</div>
  <div class="empty-sub">Ask Claude to send a file to review it here.</div>
</div>
<div id="outdated">
  <div class="outdated-icon">
    <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </div>
  <div class="outdated-title">New version available</div>
  <div class="outdated-sub">A newer file reviewer was sent to this chat. Swipe back and open the latest one.</div>
</div>
<div id="sidebar" class="sidebar"></div>
<div id="content" class="content" style="display:none"></div>
<div id="bottombar">
  <span class="hint" id="bar-hint">Long-press any line or paragraph to add a comment.</span>
  <span class="comment-count" id="bar-count" style="display:none"></span>
  <button class="send-btn" id="bar-send" style="display:none">Send to chat</button>
</div>
<div id="close-dialog" class="dialog-overlay">
  <div class="dialog">
    <div class="dialog-title">Close this file?</div>
    <div class="dialog-body" id="close-dialog-body"></div>
    <div class="dialog-actions">
      <button class="dialog-btn cancel" id="close-dialog-cancel">Cancel</button>
      <button class="dialog-btn confirm" id="close-dialog-confirm">Close</button>
    </div>
  </div>
</div>
<div id="comment-card">

<script>

// For markdown: key = paragraph index (0-indexed)
var commentsByDoc = {}; // { docIndex: { anchor: commentText } }
var editingAnchor = null; // currently editing anchor (or null)
var longPressTimer = null;

function getComments(docIndex) {
  if (!commentsByDoc[docIndex]) commentsByDoc[docIndex] = {};
  return commentsByDoc[docIndex];
}

 * and `#` comments. Strips surrounding single or double quotes.
 * Mirrors plugin/marp-detect.ts.

  var out = {};
  var lines = String(src || '').split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line || line.charAt(0) === '#') continue;
    var colon = line.indexOf(':');
    if (colon <= 0) continue;
    var key = line.slice(0, colon).trim();
    var val = line.slice(colon + 1).trim();
    if ((val.charAt(0) === '"' && val.charAt(val.length - 1) === '"') ||
        (val.charAt(0) === "'" && val.charAt(val.length - 1) === "'")) {

    }
    if (key) out[key] = val;

 *       separated by `\n---\n` lines.

    var closeMatch = sliceRest.match(/(^|\r?\n)---\r?\n/);

      var leadLen = (closeMatch[1] || '').length;
      var fmStart = firstNewline + 1;
      var fmEnd = firstNewline + 1 + closeMatch.index + leadLen;
      var fmRaw = text.slice(fmStart, fmEnd);
      var parsed = parseYamlSubset(fmRaw);

    .replace(/`([^`]+)`/g, function(_, code) { return '<code>' + esc(code) + '</code>'; })

    .replace(/^##### (.+)$/gm, '<h5>$1</h5>')
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')

    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')

    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, href) {

    // Task list items: - [ ] and - [x] (must run before plain list items)
    .replace(/^[*-] \[( |x|X)\] (.+)$/gm, function(_, mark, text) {

    .replace(/^\d+\. (.+)$/gm, '<li class="ol">$1</li>')
    // Unordered list items
    .replace(/^[*-] (.+)$/gm, '<li>$1</li>')
    .replace(/^(?!<[hlupboda]|<li|<hr|<pre|\x00)(.+)$/gm, '<p>$1</p>')

/**
 * Render source code with per-line divs for commenting.
 */
function renderSource(content, language, docIndex) {
  var doc = documents[docIndex];
  var lineOffset = (doc && doc.startLine) ? doc.startLine - 1 : 0;
  var lines = content.split('\n');
  var comments = getComments(docIndex);

  // Highlight with Prism first to get tokenized HTML
  var highlighted = '';
  if (typeof Prism !== 'undefined' && Prism.languages[language]) {
    highlighted = Prism.highlight(content, Prism.languages[language], language);
  } else {
    highlighted = esc(content);
  }

  // Split highlighted HTML by newlines, preserving spans
  var htmlLines = splitHighlightedLines(highlighted);

  var wrapper = document.createElement('div');
  wrapper.className = 'source-view';

  for (var i = 0; i < htmlLines.length; i++) {
    var lineNum = i + 1 + lineOffset;
    var lineDiv = document.createElement('div');
    lineDiv.className = 'source-line' + (comments[lineNum] ? ' commented' : '');
    lineDiv.setAttribute('data-line', String(lineNum));

    var gutter = document.createElement('div');
    gutter.className = 'line-gutter';
    if (comments[lineNum]) {
      (function(ln) {
        gutter.appendChild(makeCommentBubble(function() { openCommentCard(ln); }));
      })(lineNum);
    }

    var lineContent = document.createElement('div');
    lineContent.className = 'line-content';
    lineContent.innerHTML = htmlLines[i] || '\n';  // eslint-disable-line

    lineDiv.appendChild(gutter);
    lineDiv.appendChild(lineContent);
    wrapper.appendChild(lineDiv);

    // Long-press handler
    (function(ln) {
      attachLongPress(lineDiv, function() { openCommentCard(ln); });
    })(lineNum);
  }

  return wrapper;
}

/**
 * Split Prism-highlighted HTML into lines, properly closing/reopening spans.
 */
function splitHighlightedLines(html) {
  var lines = [];
  var current = '';
  var openTags = [];
  var i = 0;
  while (i < html.length) {
    if (html[i] === '\n') {
      // Close all open tags for this line
      for (var j = openTags.length - 1; j >= 0; j--) {
        current += '</span>';
      }
      lines.push(current);
      current = '';
      // Reopen tags for next line
      for (var k = 0; k < openTags.length; k++) {
        current += openTags[k];
      }
      i++;
    } else if (html[i] === '<') {
      var tagEnd = html.indexOf('>', i);
      if (tagEnd === -1) { current += html[i]; i++; continue; }
      var tag = html.substring(i, tagEnd + 1);
      if (tag.substring(0, 2) === '</') {
        // Closing tag
        openTags.pop();
        current += tag;
      } else if (tag.substring(0, 5) === '<span') {
        // Opening span tag
        openTags.push(tag);
        current += tag;
      } else {
        current += tag;
      }
      i = tagEnd + 1;
    } else {
      current += html[i];
      i++;
    }
  }
  // Close remaining open tags
  for (var m = openTags.length - 1; m >= 0; m--) {
    current += '</span>';
  }
  lines.push(current);
  return lines;
}

/**
 * Render a list of parsed markdown block nodes into `container`, wrapping
 * each with the appropriate .md-block wrapper and attaching long-press
 * handlers + comment bubbles. Returns the next paraIdx.
 */
function renderBlocksInto(container, children, paraIdx, comments) {
  for (var i = 0; i < children.length; i++) {
    var child = children[i];
    if (child.nodeType !== 1) continue; // skip text nodes

    // Special case: tables → each <tr> is its own commentable unit.
    // The table-wrap div is not commentable itself; rows carry data-paragraph.
    var table = (child.tagName === 'TABLE') ? child :
      (child.querySelector ? child.querySelector('table') : null);
    if (table) {
      // Wrap in a non-commentable .md-block-table for layout consistency
      var tableBlock = document.createElement('div');
      tableBlock.className = 'md-block md-block-table';
      tableBlock.appendChild(child);
      container.appendChild(tableBlock);

      var rows = table.querySelectorAll('tr');
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        row.setAttribute('data-paragraph', String(paraIdx));
        if (comments[paraIdx]) row.classList.add('commented');
        (function(pi, rowEl) {
          attachLongPress(rowEl, function() { openCommentCard(pi); });
        })(paraIdx, row);
        paraIdx++;
      }
      // Collect commented rows for this table; attach one bubble on the wrapper.
      var commentedRows = [];
      var allRows = table.querySelectorAll('tr');
      for (var rr = 0; rr < allRows.length; rr++) {
        var tr = allRows[rr];
        var tp = Number(tr.getAttribute('data-paragraph'));
        if (comments[tp]) commentedRows.push({ para: tp, rowEl: tr, rowIndex: rr + 1, text: comments[tp] });
      }
      if (commentedRows.length > 0) {
        tableBlock.classList.add('commented');
        (function(cr) {
          var bubble = makeCommentBubble(function() {
            if (cr.length === 1) { openCommentCard(cr[0].para); }
            else { showCommentPopover(bubble, cr, 'Row'); }
          }, cr.length);
          tableBlock.insertBefore(bubble, tableBlock.firstChild);
        })(commentedRows);
      }
      continue;
    }

      var listBlock = document.createElement('div');
      listBlock.className = 'md-block md-block-list';
      listBlock.appendChild(child);
      container.appendChild(listBlock);

      var items = [];
      for (var c = 0; c < child.children.length; c++) {
        if (child.children[c].tagName === 'LI') items.push(child.children[c]);
      }
      var commentedItems = [];
      for (var li = 0; li < items.length; li++) {
        var item = items[li];
        item.setAttribute('data-paragraph', String(paraIdx));
        if (comments[paraIdx]) {
          item.classList.add('commented');
          commentedItems.push({ para: paraIdx, rowEl: item, rowIndex: li + 1, text: comments[paraIdx] });
        }
        (function(pi, el) {
          attachLongPress(el, function() { openCommentCard(pi); });
        })(paraIdx, item);
        paraIdx++;
      }
      if (commentedItems.length > 0) {
        listBlock.classList.add('commented');
        (function(ci) {
          var bubble = makeCommentBubble(function() {
            if (ci.length === 1) { openCommentCard(ci[0].para); }
            else { showCommentPopover(bubble, ci, 'Item'); }
          }, ci.length);
          listBlock.insertBefore(bubble, listBlock.firstChild);
        })(commentedItems);
      }
      continue;
    }

    // Special case: fenced code blocks → each line is its own commentable unit.
    if (child.tagName === 'PRE') {
      var codeEl = child.querySelector('code');
      if (codeEl) {
        var preBlock = document.createElement('div');
        preBlock.className = 'md-block md-block-code';
        preBlock.appendChild(child);
        container.appendChild(preBlock);

        var codeHTML = codeEl.innerHTML;  // eslint-disable-line
        var htmlLines = splitHighlightedLines(codeHTML);
        // Remove the <code> element — block divs inside inline <code> is
        // invalid HTML and phone webviews rendered the line divs as inline,
        // collapsing the block onto one line. Line divs become direct
        // children of <pre>, which is block-level and universally safe.
        codeEl.parentNode.removeChild(codeEl);

        var commentedLines = [];
        for (var k = 0; k < htmlLines.length; k++) {
          var lineDiv = document.createElement('div');
          lineDiv.className = 'code-line';
          lineDiv.setAttribute('data-paragraph', String(paraIdx));
          lineDiv.innerHTML = htmlLines[k] || '\u00a0';  // eslint-disable-line
          if (comments[paraIdx]) {
            lineDiv.classList.add('commented');
            commentedLines.push({ para: paraIdx, rowEl: lineDiv, rowIndex: k + 1, text: comments[paraIdx] });
          }
          child.appendChild(lineDiv);
          (function(pi, el) {
            attachLongPress(el, function() { openCommentCard(pi); });
          })(paraIdx, lineDiv);
          paraIdx++;
        }

        if (commentedLines.length > 0) {
          preBlock.classList.add('commented');
          (function(cl) {
            var bubble = makeCommentBubble(function() {
              if (cl.length === 1) { openCommentCard(cl[0].para); }
              else { showCommentPopover(bubble, cl, 'Line'); }
            }, cl.length);
            preBlock.insertBefore(bubble, preBlock.firstChild);
          })(commentedLines);
        }
        continue;
      }
      // No <code> child: fall through to default block handling.
    }

    var block = document.createElement('div');
    block.className = 'md-block' + (comments[paraIdx] ? ' commented' : '');
    block.setAttribute('data-paragraph', String(paraIdx));
    block.appendChild(child);
    container.appendChild(block);

    // Long-press handler
    (function(pi) {
      attachLongPress(block, function() { openCommentCard(pi); });
    })(paraIdx);

    // Commented blocks get a tappable bubble in the left margin.
    if (comments[paraIdx]) {
      (function(pi) {
        var bubble = makeCommentBubble(function() { openCommentCard(pi); });
        block.insertBefore(bubble, block.firstChild);
      })(paraIdx);
    }

    paraIdx++;
  }
  return paraIdx;
}

/**
 * Render markdown with per-block wrappers for commenting. Auto-detects
 * Marp slide mode and emits per-slide <section> wrappers when applicable.
 * Writes slide metadata to documents[docIndex].slides/currentSlide/paraToSlide.
 */
function renderMarkdownWithBlocks(md, docIndex) {
  var detection = detectMarp(md);
  var doc = documents[docIndex];
  var comments = getComments(docIndex);
  var container = document.createElement('div');

  if (!detection.isSlides) {
    // Clear any stale slide state from a prior render
    if (doc) {
      doc.slides = null;
      doc.currentSlide = 0;
      doc.paraToSlide = null;
    }
    var temp = document.createElement('div');
    temp.innerHTML = renderMarkdown(md);  // eslint-disable-line
    var nodes = Array.prototype.slice.call(temp.childNodes);
    renderBlocksInto(container, nodes, 0, comments);
    return container;
  }

  // Slide mode: split body on --- and render each slide into its own section
  container.classList.add('slides-container');
  var slideTexts = detection.body.split(/\r?\n---\r?\n/);
  var cleanSlides = [];
  for (var s = 0; s < slideTexts.length; s++) {
    var t = slideTexts[s].trim();
    if (t) cleanSlides.push(t);
  }
  if (doc) {
    doc.slides = cleanSlides;
    if (typeof doc.currentSlide !== 'number' || doc.currentSlide >= cleanSlides.length || doc.currentSlide < 0) {
      doc.currentSlide = 0;
    }
    doc.paraToSlide = {};
  }

  // Sticky nav bar at top of the container
  var nav = buildSlideNav(cleanSlides.length, doc ? doc.currentSlide : 0);
  container.appendChild(nav);

  var paraIdx = 0;
  for (var si = 0; si < cleanSlides.length; si++) {
    var section = document.createElement('section');
    section.className = 'slide' + (doc && si === doc.currentSlide ? ' active' : '');
    section.setAttribute('data-slide-index', String(si));

    var tempSlide = document.createElement('div');
    tempSlide.innerHTML = renderMarkdown(cleanSlides[si]);  // eslint-disable-line
    var slideNodes = Array.prototype.slice.call(tempSlide.childNodes);
    var prevPara = paraIdx;
    paraIdx = renderBlocksInto(section, slideNodes, paraIdx, comments);
    if (doc) {
      for (var p = prevPara; p < paraIdx; p++) doc.paraToSlide[p] = si;
    }
    container.appendChild(section);
  }
  return container;
}

/**
 * Build the slide navigation bar (prev, counter, next, dots). Returns the
 * element. All interaction is routed through showSlide().
 */
function buildSlideNav(total, current) {
  var nav = document.createElement('div');
  nav.className = 'slide-nav';

  var prev = document.createElement('button');
  prev.className = 'slide-nav-btn';
  prev.setAttribute('data-dir', 'prev');
  prev.setAttribute('aria-label', 'Previous slide');
  prev.textContent = '\u25C0';
  prev.addEventListener('click', function() { showSlide((documents[activeIndex] && documents[activeIndex].currentSlide || 0) - 1); });
  nav.appendChild(prev);

  var counter = document.createElement('span');
  counter.className = 'slide-counter';
  counter.textContent = (current + 1) + ' / ' + total;
  nav.appendChild(counter);

  var next = document.createElement('button');
  next.className = 'slide-nav-btn';
  next.setAttribute('data-dir', 'next');
  next.setAttribute('aria-label', 'Next slide');
  next.textContent = '\u25B6';
  next.addEventListener('click', function() { showSlide((documents[activeIndex] && documents[activeIndex].currentSlide || 0) + 1); });
  nav.appendChild(next);

  if (total <= 20) {
    var dotsEl = document.createElement('div');
    dotsEl.className = 'slide-dots';
    for (var d = 0; d < total; d++) {
      var dot = document.createElement('button');
      dot.className = 'slide-dot' + (d === current ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to slide ' + (d + 1));
      (function(idx) {
        dot.addEventListener('click', function() { showSlide(idx); });
      })(d);
      dotsEl.appendChild(dot);
    }
    nav.appendChild(dotsEl);
  }

  updateSlideNavState(nav, current, total);
  return nav;
}

/**
 * Update disabled state + counter text + active dot on a slide-nav element.
 */
function updateSlideNavState(nav, current, total) {
  if (!nav) return;
  var prev = nav.querySelector('.slide-nav-btn[data-dir="prev"]');
  var next = nav.querySelector('.slide-nav-btn[data-dir="next"]');
  var counter = nav.querySelector('.slide-counter');
  if (prev) prev.disabled = current <= 0;
  if (next) next.disabled = current >= total - 1;
  if (counter) counter.textContent = (current + 1) + ' / ' + total;
  var dots = nav.querySelectorAll('.slide-dot');
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = 'slide-dot' + (i === current ? ' active' : '');
  }
}

/**
 * Switch to slide `idx` on the currently active doc. Clamps bounds silently.
 * No-op if the active doc isn't in slide mode.
 */
function showSlide(idx) {
  var doc = documents[activeIndex];
  if (!doc || !doc.slides) return;
  var total = doc.slides.length;
  if (idx < 0) idx = 0;
  if (idx >= total) idx = total - 1;
  if (idx === doc.currentSlide) return;
  doc.currentSlide = idx;

  var contentEl = document.getElementById('content');
  var container = contentEl.querySelector('.slides-container');
  if (!container) return;

  var sections = container.querySelectorAll('.slide');
  for (var i = 0; i < sections.length; i++) {
    var si = Number(sections[i].getAttribute('data-slide-index'));
    sections[i].classList.toggle('active', si === idx);
  }

  var nav = container.querySelector('.slide-nav');
  updateSlideNavState(nav, idx, total);

  // Scroll the container to top so the new slide starts at the top
  contentEl.scrollTop = 0;
}

/**
 * Build a tappable MessageSquare bubble. The onTap callback fires on click.
 * Touch events are stopPropagation'd to avoid triggering long-press on parent.
 */
function makeCommentBubble(onTap, count) {
  var bubble = document.createElement('span');
  bubble.className = 'comment-bubble';
  bubble.setAttribute('role', 'button');
  var n = typeof count === 'number' ? count : 0;
  bubble.setAttribute('aria-label', n > 1 ? ('Show ' + n + ' comments') : 'Show comment');
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z');
  svg.appendChild(path);
  bubble.appendChild(svg);
  if (n > 1) {
    var badge = document.createElement('span');
    badge.className = 'count-badge';
    badge.textContent = n > 9 ? '9+' : String(n);
    bubble.appendChild(badge);
  }
  bubble.addEventListener('click', function(e) {
    e.stopPropagation();
    e.preventDefault();
    onTap();
  });
  bubble.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });
  bubble.addEventListener('mousedown', function(e) { e.stopPropagation(); });
  return bubble;
}

/**
 * Show a popover near `anchor` listing `items` (commented rows/items/lines).
 * Each item: { para, rowIndex, text }. Tap → scroll to row + open its card.
 * `prefix` is the label noun ("Row", "Item", "Line"). Defaults to "Row".
 */
function showCommentPopover(anchor, items, prefix) {
  prefix = prefix || 'Row';
  closeCommentPopover();
  var pop = document.createElement('div');
  pop.className = 'comment-popover';
  pop.id = 'comment-popover';
  for (var i = 0; i < items.length; i++) {
    (function(it) {
      var btn = document.createElement('button');
      btn.className = 'comment-popover-item';
      btn.type = 'button';
      var label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = prefix + ' ' + it.rowIndex;
      var preview = document.createElement('span');
      preview.className = 'comment-preview';
      preview.textContent = it.text;
      btn.appendChild(label);
      btn.appendChild(preview);
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeCommentPopover();
        if (it.rowEl && it.rowEl.scrollIntoView) {
          it.rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        openCommentCard(it.para);
      });
      pop.appendChild(btn);
    })(items[i]);
  }
  document.body.appendChild(pop);
  // Position after mounting so we can measure popover height.
  var rect = anchor.getBoundingClientRect();
  var popRect = pop.getBoundingClientRect();
  var left = rect.right + 6;
  var top = rect.top;
  if (left + popRect.width > window.innerWidth - 8) {
    left = Math.max(8, window.innerWidth - popRect.width - 8);
  }
  if (top + popRect.height > window.innerHeight - 8) {
    top = Math.max(8, window.innerHeight - popRect.height - 8);
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  setTimeout(function() {
    document.addEventListener('click', commentPopoverOutsideClick);
    window.addEventListener('scroll', closeCommentPopover, true);
    window.addEventListener('resize', closeCommentPopover);
  }, 0);
}
function commentPopoverOutsideClick(e) {
  var pop = document.getElementById('comment-popover');
  if (!pop) return;
  if (!pop.contains(e.target)) closeCommentPopover();
}
function closeCommentPopover() {
  var pop = document.getElementById('comment-popover');
  if (pop && pop.parentNode) pop.parentNode.removeChild(pop);
  document.removeEventListener('click', commentPopoverOutsideClick);
  window.removeEventListener('scroll', closeCommentPopover, true);
  window.removeEventListener('resize', closeCommentPopover);
}

/**
 * Attach a long-press (500ms) handler to an element.
 */
function attachLongPress(el, callback) {
  var timer = null;
  var cancelled = false;

  function start(e) {
    cancelled = false;
    timer = setTimeout(function() {
      if (!cancelled) {
        e.preventDefault();
        callback();
      }
    }, 500);
  }
  function cancel() {
    cancelled = true;
    if (timer) { clearTimeout(timer); timer = null; }
  }

  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('touchcancel', cancel);
  // Desktop: mousedown
  el.addEventListener('mousedown', function(e) {
    if (e.button === 0) start(e);
  });
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

// ── Comment card ────────────────────────────────────────────────────

function openCommentCard(anchor) {
  editingAnchor = anchor;
  var comments = getComments(activeIndex);
  var existing = comments[anchor];

  var textarea = document.getElementById('comment-text');
  textarea.value = existing || '';

  var deleteBtn = document.getElementById('card-delete');
  deleteBtn.style.display = existing ? 'inline-block' : 'none';

  // Populate the target chip: "line N \u00b7 file" for source docs,
  // "block N \u00b7 file" for markdown blocks.
  var doc = documents[activeIndex];
  var title = (doc && doc.title) || '';
  var isSource = !!(doc && doc.language);
  var anchorLabel = isSource ? ('line ' + anchor) : ('block ' + (Number(anchor) + 1));
  document.getElementById('card-label').textContent = existing ? 'Editing comment' : 'Commenting on';
  document.getElementById('card-target').textContent = title ? (anchorLabel + ' \u00b7 ' + title) : anchorLabel;

  var card = document.getElementById('comment-card');
  // Position the card in the lower portion of the screen
  card.style.bottom = '62px';
  card.style.top = 'auto';
  card.style.display = 'block';

  setTimeout(function() { textarea.focus(); }, 100);
}

function closeCommentCard() {
  document.getElementById('comment-card').style.display = 'none';
  editingAnchor = null;
}

function saveComment() {
  if (editingAnchor === null) return;
  var text = document.getElementById('comment-text').value.trim();
  if (!text) { closeCommentCard(); return; }

  var comments = getComments(activeIndex);
  comments[editingAnchor] = text;
  closeCommentCard();
  showDocument(activeIndex);
  updateBottomBar();
}

function deleteComment() {
  if (editingAnchor === null) return;
  var comments = getComments(activeIndex);
  delete comments[editingAnchor];
  closeCommentCard();
  showDocument(activeIndex);
  updateBottomBar();
}

document.getElementById('card-save').addEventListener('click', saveComment);
document.getElementById('card-cancel').addEventListener('click', closeCommentCard);
document.getElementById('card-delete').addEventListener('click', deleteComment);

// ── Bottom bar ──────────────────────────────────────────────────────

function updateBottomBar() {
  var bar = document.getElementById('bottombar');
  var hint = document.getElementById('bar-hint');
  var count = document.getElementById('bar-count');
  var sendBtn = document.getElementById('bar-send');

  if (activeIndex < 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  var n = commentCount(activeIndex);
  if (n === 0) {
    hint.style.display = 'inline';
    count.style.display = 'none';
    sendBtn.style.display = 'none';
  } else {
    hint.style.display = 'none';
    count.style.display = 'inline';
    count.textContent = n + ' comment' + (n === 1 ? '' : 's');
    sendBtn.style.display = 'inline-block';
  }
}

function sendComments() {
  if (activeIndex < 0) return;
  var doc = documents[activeIndex];
  var comments = getComments(activeIndex);
  var keys = Object.keys(comments);
  if (keys.length === 0) return;

  // Build comment array
  var commentList = [];
  var lines = doc.content.split('\n');
  for (var i = 0; i < keys.length; i++) {
    var anchor = Number(keys[i]);
    var entry = { comment: comments[anchor] };

    if (doc.language) {
      // Source: anchor is line number (1-indexed)
      entry.line = anchor;
      entry.context = (lines[anchor - 1] || '').trim();
    } else {
      // Markdown: anchor is paragraph index
      entry.paragraph = anchor;
      // Slide-aware: tag which slide this block belongs to (0-indexed)
      if (doc.paraToSlide && doc.paraToSlide[anchor] !== undefined) {
        entry.slide = doc.paraToSlide[anchor];
      }
      // Get paragraph text from the rendered content
      var blocks = document.querySelectorAll('[data-paragraph="' + anchor + '"]');
      entry.context = blocks.length > 0 ? blocks[0].textContent.substring(0, 200).trim().replace(/\s+/g, ' ') : '';
    }
    commentList.push(entry);
  }

  // Sort by anchor position
  commentList.sort(function(a, b) {
    return (a.line || a.paragraph || 0) - (b.line || b.paragraph || 0);
  });

  var payload = {
    type: 'comments',
    fileTitle: doc.title,
    comments: commentList,
    senderAddr: window.webxdc.selfAddr,
  };
  if (doc.language) payload.language = doc.language;

  var n = commentList.length;
  var raw = (window.webxdc.selfName || '').trim();
  var looksLikeId = !raw || /^[0-9a-f]{16,}$/i.test(raw);
  var firstName = looksLikeId ? '' : raw.split(/\s+/)[0];
  var phrase = (n === 1 ? '1 comment' : n + ' comments');
  var infoText = firstName
    ? firstName + ' sent ' + phrase + ' for ' + doc.title
    : phrase + ' sent for ' + doc.title;
  window.webxdc.sendUpdate({ payload: payload, info: infoText }, infoText);

  // Remove the file from the app
  var removedIndex = activeIndex;
  delete commentsByDoc[removedIndex];
  documents.splice(removedIndex, 1);

  // Re-index commentsByDoc for shifted indices
  var newComments = {};
  var oldKeys = Object.keys(commentsByDoc);
  for (var j = 0; j < oldKeys.length; j++) {
    var oldIdx = Number(oldKeys[j]);
    if (oldIdx > removedIndex) {
      newComments[oldIdx - 1] = commentsByDoc[oldIdx];
    } else {
      newComments[oldIdx] = commentsByDoc[oldIdx];
    }
  }
  commentsByDoc = newComments;

  // Show next file or loading state
  if (documents.length === 0) {
    activeIndex = -1;
    document.getElementById('content').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
    document.getElementById('bottombar').style.display = 'none';
    rebuildSidebar();
  } else {
    activeIndex = Math.min(removedIndex, documents.length - 1);
    rebuildSidebar();
    showDocument(activeIndex);
    updateBottomBar();
  }
}

document.getElementById('bar-send').addEventListener('click', sendComments);

// ── Slide-mode keyboard + swipe navigation ──────────────────────────

function isSlideModeActive() {
  var doc = documents[activeIndex];
  return !!(doc && doc.slides && doc.slides.length > 1);
}

document.addEventListener('keydown', function(e) {
  if (!isSlideModeActive()) return;
  // Don't hijack arrow keys while typing in the comment card
  var tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  var doc = documents[activeIndex];
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    showSlide(doc.currentSlide - 1);
    e.preventDefault();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    showSlide(doc.currentSlide + 1);
    e.preventDefault();
  }
});

(function() {
  var contentEl = document.getElementById('content');
  if (!contentEl) return;
  var startX = 0;
  var startY = 0;
  var tracking = false;
  contentEl.addEventListener('touchstart', function(e) {
    if (!isSlideModeActive()) return;
    // Skip swipe if the touch started on a comment bubble or nav button
    var t = e.target;
    while (t && t !== contentEl) {
      if (t.classList && (t.classList.contains('comment-bubble') ||
          t.classList.contains('slide-nav-btn') || t.classList.contains('slide-dot'))) {
        return;
      }
      t = t.parentNode;
    }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });
  contentEl.addEventListener('touchend', function(e) {
    if (!tracking || !isSlideModeActive()) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      var doc = documents[activeIndex];
      if (dx < 0) showSlide(doc.currentSlide + 1);
      else showSlide(doc.currentSlide - 1);
    }
  }, { passive: true });
})();

// ── Document display ────────────────────────────────────────────────

function showDocument(index) {
  if (index < 0 || index >= documents.length) return;
  activeIndex = index;
  var contentEl = document.getElementById('content');
  contentEl.style.display = 'block';
  contentEl.replaceChildren();

  var doc = documents[index];
  if (doc.language) {
    contentEl.classList.add('source-mode');
    contentEl.appendChild(renderSource(doc.content, doc.language, index));
  } else {
    contentEl.classList.remove('source-mode');
    contentEl.appendChild(renderMarkdownWithBlocks(doc.content, index));
  }

  var tabs = document.querySelectorAll('.doc-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = 'doc-tab' + (Number(tabs[i].getAttribute('data-index')) === index ? ' active' : '');
  }

  updateBottomBar();
}

function rebuildSidebar() {
  var sidebar = document.getElementById('sidebar');
  sidebar.replaceChildren();
  for (var i = documents.length - 1; i >= 0; i--) {
    var tab = document.createElement('div');
    tab.className = 'doc-tab' + (i === activeIndex ? ' active' : '');
    tab.setAttribute('data-index', String(i));

    var titleEl = document.createElement('span');
    titleEl.className = 'tab-title';
    titleEl.textContent = documents[i].title || ('Doc ' + (i + 1));
    tab.appendChild(titleEl);

    var closeEl = document.createElement('span');
    closeEl.className = 'tab-close';
    closeEl.setAttribute('aria-label', 'Close tab');
    var closeSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    closeSvg.setAttribute('viewBox', '0 0 24 24');
    var p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p1.setAttribute('d', 'M18 6 6 18');
    var p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p2.setAttribute('d', 'm6 6 12 12');
    closeSvg.appendChild(p1);
    closeSvg.appendChild(p2);
    closeEl.appendChild(closeSvg);
    closeEl.addEventListener('click', function(e) {
      e.stopPropagation();
      var idx = Number(this.parentNode.getAttribute('data-index'));
      promptCloseTab(idx);
    });
    tab.appendChild(closeEl);

    titleEl.addEventListener('click', function() {
      showDocument(Number(this.parentNode.getAttribute('data-index')));
    });
    sidebar.appendChild(tab);
  }
}

var pendingCloseIndex = -1;
function promptCloseTab(index) {
  if (index < 0 || index >= documents.length) return;
  pendingCloseIndex = index;
  var title = documents[index].title || ('Doc ' + (index + 1));
  document.getElementById('close-dialog-body').textContent =
    'Any unsent comments on "' + title + '" will be discarded.';
  document.getElementById('close-dialog').classList.add('visible');
}
function hideCloseDialog() {
  pendingCloseIndex = -1;
  document.getElementById('close-dialog').classList.remove('visible');
}
function confirmCloseTab() {
  var index = pendingCloseIndex;
  if (index < 0 || index >= documents.length) { hideCloseDialog(); return; }
  var doc = documents[index];
  var title = doc.title || '';

  // Tell the server so the dispatcher's session map drops the doc too.
  // Server-side handler must NOT touch the filesystem — pure in-memory removal.
  window.webxdc.sendUpdate({
    payload: {
      type: 'close_tab',
      docIndex: index,
      title: title,
      senderAddr: window.webxdc.selfAddr,
    },
    summary: 'closed tab: ' + title,
  }, 'closed tab');

  // Local removal: drop the doc, drop its comments, fix activeIndex.
  documents.splice(index, 1);
  if (commentsByDoc[index]) delete commentsByDoc[index];
  // Re-key comments for docs whose index shifted down.
  var rekeyed = {};
  for (var k in commentsByDoc) {
    var oldIdx = Number(k);
    if (oldIdx > index) rekeyed[oldIdx - 1] = commentsByDoc[k];
    else rekeyed[oldIdx] = commentsByDoc[k];
  }
  commentsByDoc = rekeyed;

  if (documents.length === 0) {
    activeIndex = -1;
    document.getElementById('content').replaceChildren();
    document.getElementById('content').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
  } else {
    var newIndex = Math.min(index, documents.length - 1);
    activeIndex = newIndex;
    showDocument(newIndex);
  }
  rebuildSidebar();
  hideCloseDialog();
}
document.getElementById('close-dialog-cancel').addEventListener('click', hideCloseDialog);
document.getElementById('close-dialog-confirm').addEventListener('click', confirmCloseTab);

window.webxdc.setUpdateListener(function(update) {
  var data = update.payload;
  if (!data) return;
  if (versionMismatchSent) return;

  // Auto-upgrade: if server version is newer, request fresh app
  if (data.version && data.version > APP_VERSION && !versionMismatchSent) {
    versionMismatchSent = true;
    window.webxdc.sendUpdate({
      payload: { type: 'version_mismatch', appVersion: APP_VERSION, serverVersion: data.version, senderAddr: window.webxdc.selfAddr },
    }, 'version mismatch');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'none';
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('bottombar').style.display = 'none';
    document.getElementById('outdated').style.display = 'flex';
    return;
  }

  // Backward compat: old payloads have 'markdown' field
  var content = data.content || data.markdown;
  if (!content) return;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('empty').style.display = 'none';

  documents.push({
    title: data.title || 'Untitled',
    content: content,
    language: data.language || null,
    startLine: data.startLine || 1,
  });

  rebuildSidebar();
  showDocument(documents.length - 1);
}, 0);
</script>
</body>
</html>
