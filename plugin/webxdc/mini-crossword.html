<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mini Crossword</title>
<script src="webxdc.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #fff;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 16px;
}
h1 { font-size: 20px; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 12px; }
.timer { font-size: 15px; color: #555; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.grid-container { position: relative; margin-bottom: 14px; }
.grid {
  display: grid;
  grid-template-columns: repeat(5, 52px);
  grid-template-rows: repeat(5, 52px);
  gap: 2px;
  background: #333;
  border: 2px solid #333;
}
.cell {
  position: relative;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 600;
  text-transform: uppercase;
  cursor: pointer;
}
.cell.black { background: #333; cursor: default; }
.cell.selected { background: #a7d8ff; }
.cell.highlighted { background: #d4e9fa; }
.cell.correct { background: #c8e6c9; }
.cell.revealed { background: #fff9c4; }
.cell-number {
  position: absolute;
  top: 2px;
  left: 3px;
  font-size: 9px;
  font-weight: 500;
  color: #555;
  line-height: 1;
}
.cell input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.clues-container {
  display: flex;
  gap: 20px;
  width: 100%;
  max-width: 360px;
  margin-bottom: 16px;
}
.clue-section { flex: 1; }
.clue-section h3 { font-size: 13px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; }
.clue {
  font-size: 13px;
  line-height: 1.4;
  padding: 4px 0;
  cursor: pointer;
  border-radius: 3px;
  padding-left: 4px;
}
.clue:hover { background: #f0f0f0; }
.clue.active { background: #d4e9fa; font-weight: 600; }
.clue-num { font-weight: 700; margin-right: 3px; }
.buttons { display: flex; gap: 10px; margin-bottom: 12px; }
.btn {
  padding: 8px 16px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.btn:hover { background: #f5f5f5; }
.btn.primary { background: #333; color: #fff; border-color: #333; }
.btn.primary:hover { background: #555; }
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 12px;
  padding: 28px;
  text-align: center;
  max-width: 300px;
  width: 90%;
}
.modal h2 { font-size: 22px; margin-bottom: 8px; }
.modal .time { font-size: 32px; font-weight: 700; margin: 12px 0; color: #333; }
.modal p { font-size: 14px; color: #666; margin-bottom: 16px; }
.puzzle-select { margin-bottom: 12px; font-size: 13px; color: #666; }
.puzzle-nav { display: flex; gap: 8px; align-items: center; }
.puzzle-nav .btn { padding: 6px 12px; font-size: 12px; }
.puzzle-num { font-weight: 600; min-width: 60px; text-align: center; }
</style>
</head>
<body>

<h1>Mini Crossword</h1>
<div class="subtitle">5 x 5</div>
<div class="puzzle-nav">
  <button class="btn" id="prevPuzzle">&larr;</button>
  <span class="puzzle-num" id="puzzleNum">Puzzle 1</span>
  <button class="btn" id="nextPuzzle">&rarr;</button>
</div>
<div class="timer" id="timer">0:00</div>
<div class="grid-container">
  <div class="grid" id="grid"></div>
</div>
<input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
  style="position:fixed;top:-100px;left:-100px;opacity:0;width:1px;height:1px;">
<div class="clues-container">
  <div class="clue-section">
    <h3>Across</h3>
    <div id="acrossClues"></div>
  </div>
  <div class="clue-section">
    <h3>Down</h3>
    <div id="downClues"></div>
  </div>
</div>
<div class="buttons">
  <button class="btn" id="checkBtn">Check</button>
  <button class="btn" id="revealBtn">Reveal</button>
  <button class="btn primary" id="clearBtn">Clear</button>
</div>

<div class="modal-overlay" id="winModal">
  <div class="modal">
    <h2>Solved!</h2>
    <div class="time" id="winTime">0:00</div>
    <p id="winMsg">Nice work!</p>
    <button class="btn primary" id="shareBtn">Share Score</button>
    <div style="height:8px"></div>
    <button class="btn" id="nextAfterWin">Next Puzzle</button>
  </div>
</div>

<script>
var PUZZLES = [
  {
    grid: [
      'SWIFT',
      'HONES',
      'ALERT',
      'RESET',
      'PESTS'
    ],
    black: [],
    clues: {
      across: {
        1: 'Fast, or a programming language',
        6: 'Sharpens, as a skill',
        7: 'Watchful and attentive',
        8: 'Start over, as a device',
        9: 'Annoying bugs (literally)'
      },
      down: {
        1: 'Divides fairly',
        2: 'Desire to drink',
        3: 'Change or modify',
        4: 'Go into',
        5: 'Evaluations'
      }
    }
  },
  {
    grid: [
      'BRAVE',
      'LEMON',
      'OPERA',
      'CARGO',
      'KNELT'
    ],
    black: [],
    clues: {
      across: {
        1: 'Courageous',
        6: 'Sour citrus fruit',
        7: 'La Boheme, for one',
        8: 'Ship\'s freight',
        9: 'Got on one\'s knees'
      },
      down: {
        1: 'Obstruction',
        2: 'Repent',
        3: 'Like some humor or steak',
        4: 'Intensely eager',
        5: 'Brought to court'
      }
    }
  },
  {
    grid: [
      'CRASH',
      'LINER',
      'OMEGA',
      'UNITE',
      'DEBUG'
    ],
    black: [],
    clues: {
      across: {
        1: 'System failure, or a loud sound',
        6: 'Cruise ship',
        7: 'Last Greek letter',
        8: 'Bring together',
        9: 'Find and fix errors in code'
      },
      down: {
        1: 'Loud or showy',
        2: 'Kingdom',
        3: 'Eager',
        4: 'Wise saying',
        5: 'Pirate\'s drink, traditionally'
      }
    }
  },
  {
    grid: [
      'PLANT',
      'ROUSE',
      'INBOX',
      'DELTA',
      'ESSAY'
    ],
    black: [],
    clues: {
      across: {
        1: 'Factory, or put in the ground',
        6: 'Stir from sleep',
        7: 'Where emails land',
        8: 'River mouth, or chat app',
        9: 'Written composition'
      },
      down: {
        1: 'Value, as in money',
        2: 'Lunar stage',
        3: 'Highest point',
        4: 'Musical notes holder',
        5: 'Attempts to score'
      }
    }
  },
  {
    grid: [
      'FETCH',
      'ELBOW',
      'ARENA',
      'TIGER',
      'SWAYS'
    ],
    black: [],
    clues: {
      across: {
        1: 'Retrieve, or an API call',
        6: 'Arm joint',
        7: 'Concert venue',
        8: 'Striped big cat',
        9: 'Moves back and forth'
      },
      down: {
        1: 'Celebrations',
        2: 'Tardy',
        3: 'Bring about',
        4: 'Person who rents',
        5: 'Whirlpools'
      }
    }
  }
];

var currentPuzzle = 0;
var grid = [];
var selected = null;
var direction = 'across';
var timerStart = null;
var timerInterval = null;
var solved = false;
var cellElements = [];

function getPuzzle() { return PUZZLES[currentPuzzle]; }

function clearChildren(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function getNumberGrid() {
  var nums = Array.from({length: 5}, function() { return Array(5).fill(0); });
  var n = 1;
  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 5; c++) {
      var needsNum = false;
      if (c === 0 || isBlack(r, c-1)) needsNum = true;
      if (r === 0 || isBlack(r-1, c)) needsNum = true;
      if (needsNum && !isBlack(r,c)) { nums[r][c] = n++; }
    }
  }
  return nums;
}

function isBlack(r, c) {
  if (r < 0 || r >= 5 || c < 0 || c >= 5) return true;
  var puzzle = getPuzzle();
  return puzzle.black && puzzle.black.some(function(b){return b[0]===r&&b[1]===c;});
}

function buildGrid() {
  var gridEl = document.getElementById('grid');
  clearChildren(gridEl);
  cellElements = [];
  var nums = getNumberGrid();

  for (var r = 0; r < 5; r++) {
    cellElements[r] = [];
    for (var c = 0; c < 5; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell' + (isBlack(r,c) ? ' black' : '');
      cell.dataset.r = r;
      cell.dataset.c = c;

      if (nums[r][c] > 0 && !isBlack(r,c)) {
        var numSpan = document.createElement('span');
        numSpan.className = 'cell-number';
        numSpan.textContent = nums[r][c];
        cell.appendChild(numSpan);
      }

      var letter = document.createElement('span');
      letter.className = 'cell-letter';
      letter.textContent = grid[r][c] || '';
      cell.appendChild(letter);

      if (!isBlack(r,c)) {
        (function(row, col) {
          cell.addEventListener('click', function() { selectCell(row, col); });
        })(r, c);
      }

      gridEl.appendChild(cell);
      cellElements[r][c] = cell;
    }
  }
}

function buildClues() {
  var puzzle = getPuzzle();
  var acrossEl = document.getElementById('acrossClues');
  var downEl = document.getElementById('downClues');
  clearChildren(acrossEl);
  clearChildren(downEl);

  Object.keys(puzzle.clues.across).forEach(function(n) {
    var div = document.createElement('div');
    div.className = 'clue';
    div.dataset.dir = 'across';
    div.dataset.num = n;
    var numSpan = document.createElement('span');
    numSpan.className = 'clue-num';
    numSpan.textContent = n;
    div.appendChild(numSpan);
    div.appendChild(document.createTextNode(puzzle.clues.across[n]));
    div.addEventListener('click', function() { selectClue('across', Number(n)); });
    acrossEl.appendChild(div);
  });

  Object.keys(puzzle.clues.down).forEach(function(n) {
    var div = document.createElement('div');
    div.className = 'clue';
    div.dataset.dir = 'down';
    div.dataset.num = n;
    var numSpan = document.createElement('span');
    numSpan.className = 'clue-num';
    numSpan.textContent = n;
    div.appendChild(numSpan);
    div.appendChild(document.createTextNode(puzzle.clues.down[n]));
    div.addEventListener('click', function() { selectClue('down', Number(n)); });
    downEl.appendChild(div);
  });
}

function selectClue(dir, num) {
  var nums = getNumberGrid();
  direction = dir;
  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 5; c++) {
      if (nums[r][c] === num && !isBlack(r,c)) {
        selectCell(r, c, true);
        return;
      }
    }
  }
}

function selectCell(r, c, forceKeepDir) {
  if (isBlack(r,c) || solved) return;
  if (selected && selected.r === r && selected.c === c && !forceKeepDir) {
    direction = direction === 'across' ? 'down' : 'across';
  }
  selected = {r: r, c: c};
  updateHighlights();
  document.getElementById('hiddenInput').focus();
  if (!timerStart) startTimer();
}

function getWordCells(r, c, dir) {
  var cells = [];
  if (dir === 'across') {
    var startC = c;
    while (startC > 0 && !isBlack(r, startC-1)) startC--;
    for (var cc = startC; cc < 5 && !isBlack(r, cc); cc++) cells.push({r:r, c:cc});
  } else {
    var startR = r;
    while (startR > 0 && !isBlack(startR-1, c)) startR--;
    for (var rr = startR; rr < 5 && !isBlack(rr, c); rr++) cells.push({r:rr, c:c});
  }
  return cells;
}

function updateHighlights() {
  var nums = getNumberGrid();
  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 5; c++) {
      if (!isBlack(r,c)) {
        cellElements[r][c].classList.remove('selected', 'highlighted');
      }
    }
  }
  document.querySelectorAll('.clue').forEach(function(el) { el.classList.remove('active'); });

  if (!selected) return;

  var wordCells = getWordCells(selected.r, selected.c, direction);
  wordCells.forEach(function(pos) {
    cellElements[pos.r][pos.c].classList.add('highlighted');
  });
  cellElements[selected.r][selected.c].classList.add('selected');

  var startCell = wordCells[0];
  var clueNum = nums[startCell.r][startCell.c];
  if (clueNum) {
    var clueEl = document.querySelector('.clue[data-dir="'+direction+'"][data-num="'+clueNum+'"]');
    if (clueEl) {
      clueEl.classList.add('active');
      clueEl.scrollIntoView({block: 'nearest'});
    }
  }
}

function moveToNext() {
  if (!selected) return;
  var wordCells = getWordCells(selected.r, selected.c, direction);
  var idx = wordCells.findIndex(function(p) { return p.r === selected.r && p.c === selected.c; });
  if (idx < wordCells.length - 1) {
    selected = wordCells[idx + 1];
  } else {
    moveToNextWord();
  }
  updateHighlights();
}

function moveToPrev() {
  if (!selected) return;
  var wordCells = getWordCells(selected.r, selected.c, direction);
  var idx = wordCells.findIndex(function(p) { return p.r === selected.r && p.c === selected.c; });
  if (idx > 0) {
    selected = wordCells[idx - 1];
    updateHighlights();
  }
}

function moveToNextWord() {
  var nums = getNumberGrid();
  var clueNums = Object.keys(getPuzzle().clues[direction]).map(Number).sort(function(a,b){return a-b;});
  var wordCells = getWordCells(selected.r, selected.c, direction);
  var startCell = wordCells[0];
  var currentNum = nums[startCell.r][startCell.c];
  var idx = clueNums.indexOf(currentNum);

  if (idx < clueNums.length - 1) {
    selectClue(direction, clueNums[idx + 1]);
  } else {
    var otherDir = direction === 'across' ? 'down' : 'across';
    var otherNums = Object.keys(getPuzzle().clues[otherDir]).map(Number).sort(function(a,b){return a-b;});
    if (otherNums.length > 0) {
      direction = otherDir;
      selectClue(otherDir, otherNums[0]);
    }
  }
}

function setCell(r, c, letter) {
  grid[r][c] = letter;
  var span = cellElements[r][c].querySelector('.cell-letter');
  if (span) span.textContent = letter;
}

document.getElementById('hiddenInput').addEventListener('input', function(e) {
  if (!selected || solved) return;
  var val = (e.data || '').toUpperCase();
  if (val && /^[A-Z]$/.test(val)) {
    setCell(selected.r, selected.c, val);
    moveToNext();
    checkWin();
  }
  this.value = '';
});

document.getElementById('hiddenInput').addEventListener('keydown', function(e) {
  if (!selected || solved) return;
  if (e.key === 'Backspace') {
    e.preventDefault();
    if (grid[selected.r][selected.c]) {
      setCell(selected.r, selected.c, '');
    } else {
      moveToPrev();
      setCell(selected.r, selected.c, '');
    }
  } else if (e.key === 'ArrowRight') { e.preventDefault(); direction = 'across'; moveToNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); direction = 'across'; moveToPrev(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); direction = 'down'; moveToNext(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); direction = 'down'; moveToPrev(); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    moveToNextWord();
  }
});

function startTimer() {
  timerStart = Date.now();
  timerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - timerStart) / 1000);
    var m = Math.floor(elapsed / 60);
    var s = elapsed % 60;
    document.getElementById('timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
  }, 1000);
}

function formatTime(ms) {
  var secs = Math.floor(ms / 1000);
  var m = Math.floor(secs / 60);
  var s = secs % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function checkWin() {
  var puzzle = getPuzzle();
  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 5; c++) {
      if (!isBlack(r,c) && grid[r][c] !== puzzle.grid[r][c]) return;
    }
  }
  solved = true;
  clearInterval(timerInterval);
  var elapsed = Date.now() - timerStart;
  var timeStr = formatTime(elapsed);

  for (var r2 = 0; r2 < 5; r2++) {
    for (var c2 = 0; c2 < 5; c2++) {
      if (!isBlack(r2,c2)) cellElements[r2][c2].classList.add('correct');
    }
  }

  document.getElementById('winTime').textContent = timeStr;
  var msgs = ['Brilliant!', 'Nice work!', 'Well done!', 'Impressive!', 'Sharp mind!'];
  document.getElementById('winMsg').textContent = msgs[Math.floor(Math.random() * msgs.length)];
  setTimeout(function() {
    document.getElementById('winModal').classList.add('show');
  }, 500);

  window.webxdc.sendUpdate({
    payload: {
      type: 'solved',
      puzzle: currentPuzzle + 1,
      time: timeStr,
      timeMs: elapsed,
      senderAddr: window.webxdc.selfAddr
    }
  }, window.webxdc.selfName + ' solved puzzle ' + (currentPuzzle+1) + ' in ' + timeStr);
}

document.getElementById('checkBtn').addEventListener('click', function() {
  var puzzle = getPuzzle();
  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 5; c++) {
      if (!isBlack(r,c) && grid[r][c] && grid[r][c] !== puzzle.grid[r][c]) {
        cellElements[r][c].style.color = '#d32f2f';
        (function(rr,cc) {
          setTimeout(function() { cellElements[rr][cc].style.color = ''; }, 1500);
        })(r,c);
      }
    }
  }
});

document.getElementById('revealBtn').addEventListener('click', function() {
  if (!selected || solved) return;
  var puzzle = getPuzzle();
  var wordCells = getWordCells(selected.r, selected.c, direction);
  wordCells.forEach(function(pos) {
    setCell(pos.r, pos.c, puzzle.grid[pos.r][pos.c]);
    cellElements[pos.r][pos.c].classList.add('revealed');
  });
  checkWin();
});

document.getElementById('clearBtn').addEventListener('click', function() {
  if (solved) return;
  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 5; c++) {
      if (!isBlack(r,c)) {
        setCell(r, c, '');
        cellElements[r][c].classList.remove('revealed');
      }
    }
  }
});

document.getElementById('shareBtn').addEventListener('click', function() {
  document.getElementById('winModal').classList.remove('show');
});

document.getElementById('nextAfterWin').addEventListener('click', function() {
  document.getElementById('winModal').classList.remove('show');
  loadPuzzle((currentPuzzle + 1) % PUZZLES.length);
});

document.getElementById('prevPuzzle').addEventListener('click', function() {
  loadPuzzle((currentPuzzle - 1 + PUZZLES.length) % PUZZLES.length);
});

document.getElementById('nextPuzzle').addEventListener('click', function() {
  loadPuzzle((currentPuzzle + 1) % PUZZLES.length);
});

function loadPuzzle(idx) {
  currentPuzzle = idx;
  solved = false;
  selected = null;
  clearInterval(timerInterval);
  timerStart = null;
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('puzzleNum').textContent = 'Puzzle ' + (idx + 1);

  grid = [];
  for (var r = 0; r < 5; r++) {
    grid[r] = [];
    for (var c = 0; c < 5; c++) {
      grid[r][c] = '';
    }
  }

  buildGrid();
  buildClues();
}

var bestTimes = {};
window.webxdc.setUpdateListener(function(update) {
  var data = update.payload;
  if (!data || data.type !== 'solved') return;
  var key = data.puzzle;
  if (!bestTimes[key] || data.timeMs < bestTimes[key].timeMs) {
    bestTimes[key] = data;
  }
}, 0);

loadPuzzle(0);
</script>
</body>
</html>
