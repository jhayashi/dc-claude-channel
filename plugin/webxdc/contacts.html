<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="webxdc.js"></script>
<style>
:root {
  --bg:        #0B0F17;
  --surface:   #131826;
  --surface-2: #1A2030;
  --surface-3: #232A3C;
  --line:      #2C3447;
  --line-soft: #1F2536;
  --ink:       #E8ECF5;
  --ink-mute:  #99A2B8;
  --ink-faint: #6C748A;
  --paper:     #FAF9F5;
  --orange:    #D97757;
  --green:     #3DA85A;
  --amber:     #C99A35;
  --blue:      #6DA3D9;
  --danger:    #E5694C;
  --radius:    14px;
  --radius-sm: 10px;
  --radius-pill: 999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  letter-spacing: 0.005em;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
}

/* Card wrapper fills the viewport */
#shell {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
  width: 100%;
}

/* Views — only one .visible at a time */
#view-contacts, #view-role-picker {
  display: none;
  flex-direction: column;
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
}
#view-contacts.visible, #view-role-picker.visible {
  display: flex;
}

/* Title bar */
.title-bar {
  position: relative;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line-soft);
  flex-shrink: 0;
}
.title-bar .title { font: 600 18px/1.2 inherit; color: var(--ink); }
.title-bar .subtitle { font: 500 12px/1.3 inherit; color: var(--ink-mute); margin-top: 2px; display: none; }
.title-bar .subtitle.visible { display: block; }
.title-bar .crumb {
  font: 500 11px/1 inherit;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  display: inline-flex; align-items: center; gap: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  background: transparent;
  border: 0;
  padding: 2px 0;
}
.title-bar .crumb svg { width: 12px; height: 12px; }

/* Body */
.body {
  flex: 1 1 0;
  overflow-y: auto;
  min-height: 0;
  padding: 18px 20px;
}

/* Section label */
.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #6e7681;
  margin: 4px 0 10px;
  font-weight: 600;
}

/* Contact rows */
.contact-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px;
  cursor: pointer; font-family: inherit; color: var(--ink); text-align: left;
  width: 100%; transition: border-color 0.15s, background 0.15s;
}
.contact-row:hover { border-color: var(--orange); background: var(--surface-2); }
.contact-row:active { transform: scale(0.98); }
.contact-badge {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.contact-badge-orange { background: var(--orange); }
.contact-badge-surface { background: var(--surface-3); border: 1px solid var(--line); }
.contact-badge-amber { background: rgba(201,154,53,0.15); border: 1px solid var(--amber); }
.contact-badge-faint { background: var(--surface-2); border: 1px solid var(--line-soft); }
.contact-meta { flex: 1; min-width: 0; }
.contact-row-name { font: 600 13px/1.2 inherit; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-row-addr { font: 400 11px/1.3 'SF Mono', 'Cascadia Code', monospace; color: var(--ink-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-chevron { color: var(--line); flex-shrink: 0; }
.contacts-empty { font-size: 12px; color: var(--ink-faint); font-style: italic; margin-bottom: 8px; }

/* Role chips */
.role-chip {
  border-radius: var(--radius-pill); padding: 3px 8px;
  font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
  letter-spacing: 0.03em; text-transform: uppercase;
}
.role-chip-none     { background: transparent; color: var(--ink-faint); border: 1px dashed var(--line); }
.role-chip-sub      { background: var(--surface-3); color: var(--ink-mute); border: 1px solid var(--line); }
.role-chip-trusted  { background: rgba(217,119,87,0.15); color: var(--orange); border: 1px solid rgba(217,119,87,0.3); }
.role-chip-family   { background: rgba(201,154,53,0.15); color: var(--amber); border: 1px solid rgba(201,154,53,0.3); }
.role-chip-untrust  { background: var(--surface-2); color: var(--ink-faint); border: 1px solid var(--line-soft); }

/* Contact hero (role picker top) */
.contact-hero {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 20px 0 16px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px;
}
.contact-hero-badge {
  width: 56px; height: 56px; border-radius: 50%; background: var(--orange);
  display: flex; align-items: center; justify-content: center;
}
.contact-hero-name { font: 700 17px/1.2 inherit; color: var(--ink); letter-spacing: -0.01em; text-align: center; }
.contact-hero-addr { font: 400 11px/1.3 'SF Mono', 'Cascadia Code', monospace; color: var(--ink-faint); text-align: center; }

/* Role options */
.role-option-row {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 6px;
  cursor: pointer; font-family: inherit; color: var(--ink); text-align: left;
  width: 100%; transition: border-color 0.15s, background 0.15s;
}
.role-option-row:hover  { border-color: var(--orange); background: var(--surface-2); }
.role-option-row.selected { border-color: var(--orange); background: rgba(217,119,87,0.06); }
.role-option-row:active { transform: scale(0.98); }
.role-radio-outer {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
  border: 2px solid var(--line); background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, background 0.15s;
}
.role-option-row.selected .role-radio-outer { border-color: var(--orange); background: var(--orange); }
.role-radio-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--paper); display: none; }
.role-option-row.selected .role-radio-dot { display: block; }
.role-option-info { flex: 1; }
.role-option-name { font: 600 13px/1.3 inherit; color: var(--ink); }
.role-option-row.selected .role-option-name { color: var(--orange); }
.role-option-caps {
  display: inline-block; font: 600 9px/1 'SF Mono', 'Cascadia Code', monospace;
  letter-spacing: 0.04em; color: var(--ink-faint); background: var(--surface-3);
  border: 1px solid var(--line); border-radius: 3px; padding: 2px 5px;
  margin: 4px 0 3px;
}
.role-option-desc { font: 400 11px/1.4 inherit; color: var(--ink-faint); }

/* Save bar (sticky bottom on role picker) */
.contacts-save-bar {
  position: sticky; bottom: 0; background: var(--bg);
  border-top: 1px solid var(--line-soft);
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  margin: 12px -20px -18px;
}

/* Inline error on role picker */
.role-assign-err {
  font-size: 12px; color: var(--danger); background: rgba(229,105,76,0.08);
  border: 1px solid rgba(229,105,76,0.25); border-radius: var(--radius-sm);
  padding: 8px 12px; margin-bottom: 10px; display: none;
}
.role-assign-err.visible { display: block; }

/* Saved-confirmation banner (top of contacts list, auto-hides) */
.saved-banner {
  font-size: 12px; font-weight: 600; color: var(--green);
  background: rgba(61,168,90,0.12); border: 1px solid rgba(61,168,90,0.3);
  border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 10px;
  display: none;
}
.saved-banner.visible { display: block; }

/* Buttons */
.btn {
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-primary {
  background: var(--orange);
  color: var(--paper);
  border: 1px solid var(--orange);
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: 0.45; }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--surface-2); }

/* Assign-progress modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 16px;
  padding: 28px 24px;
  max-width: 320px;
  width: 90%;
  text-align: center;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--line);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
</style>
</head>
<body>

<div id="shell">

  <!-- Contacts list view -->
  <div id="view-contacts">
    <div class="title-bar">
      <div class="title">Contacts &amp; Roles</div>
      <div class="subtitle" id="contacts-subtitle"></div>
    </div>
    <div class="body">
      <div id="saved-banner" class="saved-banner" role="status"></div>
      <div class="section-label">Needs Role</div>
      <div id="contacts-needs"></div>
      <div class="section-label">Assigned Roles</div>
      <div id="contacts-assigned"></div>
      <div class="section-label">Subscribers</div>
      <div id="contacts-subscribers"></div>
    </div>
  </div>

  <!-- Role picker view -->
  <div id="view-role-picker">
    <div class="title-bar">
      <button class="crumb" type="button" onclick="showView('contacts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Contacts
      </button>
      <div class="title" id="role-picker-title">Contact</div>
    </div>
    <div class="body">
      <div id="role-picker-hero"></div>
      <div class="section-label" style="margin-top:12px;">Assign Role</div>
      <div id="role-assign-err" class="role-assign-err" role="alert"></div>
      <div id="role-picker-list"></div>
      <div class="contacts-save-bar">
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" style="flex:1;" type="button" onclick="showView('contacts')">Cancel</button>
          <button class="btn btn-primary" style="flex:1;" id="role-save-btn" type="button" onclick="saveRole()" disabled>Save Role</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Assign-progress modal -->
<div id="assign-progress-modal" class="modal-overlay">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="spinner"></div>
    <div style="color:var(--ink);font-size:15px;font-weight:600;">Assigning role</div>
    <div id="assign-progress-sub" style="color:var(--ink-mute);margin-top:4px;font-size:13px;"></div>
  </div>
</div>

<script>
var APP_VERSION = 1.01;
var versionMismatchSent = false;

// ── State ──────────────────────────────────────────────────────────────────
var contactList = [];
var activeContact = null;
var selectedRole = null;
var assignTimeout = null;
var savedBannerTimer = null;

var ROLE_DISPLAY = {
  'subscriber':      { label: 'Subscriber',        chipCls: 'role-chip-sub',     badgeCls: 'contact-badge-surface', iconColor: 'var(--ink-mute)' },
  'trusted-agent':   { label: 'Trusted Agent',     chipCls: 'role-chip-trusted', badgeCls: 'contact-badge-orange',  iconColor: 'var(--paper)' },
  'family-member':   { label: 'Family Member',     chipCls: 'role-chip-family',  badgeCls: 'contact-badge-amber',   iconColor: 'var(--amber)' },
  'untrusted-agent': { label: 'Untrusted Contact', chipCls: 'role-chip-untrust', badgeCls: 'contact-badge-faint',   iconColor: 'var(--ink-faint)' },
  'guest':           { label: 'Untrusted Contact', chipCls: 'role-chip-untrust', badgeCls: 'contact-badge-faint',   iconColor: 'var(--ink-faint)' },
  'no-permissions':  { label: 'No Permissions',    chipCls: 'role-chip-untrust', badgeCls: 'contact-badge-faint',   iconColor: 'var(--ink-faint)' },
};

var ROLE_OPTIONS = [
  { id: 'subscriber',      label: 'Subscriber',        caps: '["*"]',                    desc: 'Full access — all agent tools, schedules, and data operations' },
  { id: 'trusted-agent',   label: 'Trusted Agent',     caps: '["*"]',                    desc: 'Automated account with full subscriber privileges' },
  { id: 'family-member',   label: 'Family Member',     caps: '["chat", "low_stakes_*"]', desc: 'Messaging and low-stakes operations — no schedules or infrastructure' },
  { id: 'untrusted-agent', label: 'Untrusted Contact', caps: '["chat"]',                 desc: 'Messaging only — no tool access, schedules, or data operations' },
  { id: 'guest',           label: 'Guest',             caps: '["chat"]',                 desc: 'Messaging only — equivalent to untrusted-agent' },
  { id: 'no-permissions',  label: 'No Permissions',    caps: '[]',                       desc: 'Bot ignores this contact entirely — no replies, no tool access' },
];

// ── View switching ─────────────────────────────────────────────────────────
function showView(view) {
  var contacts = document.getElementById('view-contacts');
  var picker = document.getElementById('view-role-picker');
  if (view === 'contacts') {
    contacts.classList.add('visible');
    picker.classList.remove('visible');
  } else {
    picker.classList.add('visible');
    contacts.classList.remove('visible');
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function userIconSVG(size, color) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>';
}
var CHEVRON_SVG = '<svg class="contact-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

function roleChipHTML(role) {
  if (!role) return '<span class="role-chip role-chip-none">No role</span>';
  var d = ROLE_DISPLAY[role];
  if (!d) return '<span class="role-chip role-chip-none">' + role + '</span>';
  return '<span class="role-chip ' + d.chipCls + '">' + d.label + '</span>';
}

function contactRowHTML(c) {
  var d = c.role ? ROLE_DISPLAY[c.role] : null;
  var bc = d ? d.badgeCls : 'contact-badge-faint';
  var ic = d ? d.iconColor : 'var(--line)';
  return '<button class="contact-row" onclick="openRolePicker(' + c.contactId + ')">' +
    '<div class="contact-badge ' + bc + '">' + userIconSVG(17, ic) + '</div>' +
    '<div class="contact-meta">' +
      '<div class="contact-row-name">' + (c.displayName || 'Contact ' + c.contactId) + '</div>' +
      (c.chatmailAddress ? '<div class="contact-row-addr">' + c.chatmailAddress + '</div>' : '') +
    '</div>' +
    roleChipHTML(c.role) +
    CHEVRON_SVG +
  '</button>';
}

// ── Managed-agent subtitle (#120) ────────────────────────────────────────
function updateManagedAgentSubtitle(name) {
  var el = document.getElementById('contacts-subtitle');
  if (!el) return;
  if (name) {
    el.textContent = 'Roles for ' + name;
    el.classList.add('visible');
  } else {
    el.textContent = '';
    el.classList.remove('visible');
  }
}

// ── Saved confirmation banner (#120) ──────────────────────────────────────
function showSavedBanner(name, roleLabel) {
  var el = document.getElementById('saved-banner');
  if (!el) return;
  el.textContent = 'Role saved — ' + name + ' is now ' + roleLabel + '.';
  el.classList.add('visible');
  if (savedBannerTimer) clearTimeout(savedBannerTimer);
  savedBannerTimer = setTimeout(function() {
    el.classList.remove('visible');
    savedBannerTimer = null;
  }, 4000);
}

// ── Contacts list ──────────────────────────────────────────────────────────
function renderContactList(contacts) {
  contactList = contacts || [];
  var needs = contactList.filter(function(c) { return !c.role; });
  var assigned = contactList.filter(function(c) { return c.role && c.role !== 'subscriber'; });
  var subs = contactList.filter(function(c) { return c.role === 'subscriber'; });

  function fill(elId, arr) {
    var el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = arr.length
      ? arr.map(contactRowHTML).join('')
      : '<div class="contacts-empty">None</div>';
  }
  fill('contacts-needs', needs);
  fill('contacts-assigned', assigned);
  fill('contacts-subscribers', subs);
}

// ── Role picker ────────────────────────────────────────────────────────────
function openRolePicker(contactId) {
  var c = null;
  for (var i = 0; i < contactList.length; i++) {
    if (contactList[i].contactId === contactId) { c = contactList[i]; break; }
  }
  if (!c) return;
  activeContact = c;
  selectedRole = c.role || null;

  var titleEl = document.getElementById('role-picker-title');
  if (titleEl) titleEl.textContent = c.displayName || ('Contact ' + c.contactId);

  var heroEl = document.getElementById('role-picker-hero');
  if (heroEl) heroEl.innerHTML =
    '<div class="contact-hero">' +
      '<div class="contact-hero-badge">' + userIconSVG(28, 'var(--paper)') + '</div>' +
      '<div class="contact-hero-name">' + (c.displayName || 'Contact ' + c.contactId) + '</div>' +
      (c.chatmailAddress ? '<div class="contact-hero-addr">' + c.chatmailAddress + '</div>' : '') +
      roleChipHTML(c.role) +
    '</div>';

  // Clear any prior error
  hideRoleAssignErr();
  renderRoleOptions();
  updateSaveBtn();
  showView('role-picker');
}

function renderRoleOptions() {
  var el = document.getElementById('role-picker-list');
  if (!el) return;
  el.innerHTML = ROLE_OPTIONS.map(function(r) {
    var sel = selectedRole === r.id ? ' selected' : '';
    return '<button class="role-option-row' + sel + '" type="button" onclick="pickRole(\'' + r.id + '\')">' +
      '<div class="role-radio-outer"><div class="role-radio-dot"></div></div>' +
      '<div class="role-option-info">' +
        '<div class="role-option-name">' + r.label + '</div>' +
        '<div class="role-option-caps">' + r.caps + '</div>' +
        '<div class="role-option-desc">' + r.desc + '</div>' +
      '</div>' +
    '</button>';
  }).join('');
}

function pickRole(roleId) {
  selectedRole = roleId;
  renderRoleOptions();
  updateSaveBtn();
}

function updateSaveBtn() {
  var btn = document.getElementById('role-save-btn');
  if (!btn) return;
  var unchanged = activeContact && selectedRole === (activeContact.role || null);
  btn.disabled = unchanged || !selectedRole;
}

function hideRoleAssignErr() {
  var el = document.getElementById('role-assign-err');
  if (el) { el.classList.remove('visible'); el.textContent = ''; }
}

function showRoleAssignErr(message) {
  var el = document.getElementById('role-assign-err');
  if (!el) return;
  el.textContent = message;
  el.classList.add('visible');
}

function saveRole() {
  if (!activeContact || !selectedRole) return;
  hideRoleAssignErr();
  var sub = document.getElementById('assign-progress-sub');
  var displayRole = (ROLE_DISPLAY[selectedRole] || {}).label || selectedRole;
  if (sub) sub.textContent = (activeContact.displayName || 'Contact') + ' → ' + displayRole;
  var modal = document.getElementById('assign-progress-modal');
  if (modal) modal.classList.add('visible');
  var btn = document.getElementById('role-save-btn');
  if (btn) btn.disabled = true;
  window.webxdc.sendUpdate({
    payload: {
      type: 'assign_role',
      contactId: activeContact.contactId,
      role: selectedRole,
      senderAddr: window.webxdc.selfAddr,
    },
  }, '');
  // #123: the card had ZERO timeouts — a silent server left the
  // "Assigning role" progress modal spinning forever with no escape.
  if (assignTimeout) clearTimeout(assignTimeout);
  assignTimeout = setTimeout(function() {
    assignTimeout = null;
    var m = document.getElementById('assign-progress-modal');
    if (m) m.classList.remove('visible');
    var b = document.getElementById('role-save-btn');
    if (b) b.disabled = false;
    showRoleAssignErr('The server did not respond. Ask Claude to send a fresh contacts card and try again.');
  }, 15000);
}

function onRoleAssigned(updatedContact) {
  if (assignTimeout) { clearTimeout(assignTimeout); assignTimeout = null; }
  var modal = document.getElementById('assign-progress-modal');
  if (modal) modal.classList.remove('visible');
  // Patch local list
  for (var i = 0; i < contactList.length; i++) {
    if (contactList[i].contactId === updatedContact.contactId) {
      contactList[i] = updatedContact;
      break;
    }
  }
  renderContactList(contactList);
  // #120: the only prior signal was the contact quietly moving sections —
  // add an explicit "Role saved" confirmation.
  var displayRole = (ROLE_DISPLAY[updatedContact.role] || {}).label || updatedContact.role;
  showSavedBanner(updatedContact.displayName || ('Contact ' + updatedContact.contactId), displayRole);
  showView('contacts');
}

function onRoleAssignErr(contactId, message) {
  if (assignTimeout) { clearTimeout(assignTimeout); assignTimeout = null; }
  var modal = document.getElementById('assign-progress-modal');
  if (modal) modal.classList.remove('visible');
  // Re-enable save button so user can retry
  var btn = document.getElementById('role-save-btn');
  if (btn) btn.disabled = false;
  showRoleAssignErr(message || 'Failed to assign role.');
  // Stay on role picker — do NOT navigate back to contacts
}

// ── WebXDC update listener ─────────────────────────────────────────────────
window.webxdc.setUpdateListener(function(update) {
  var d = update.payload;
  if (!d) return;

  if (d.type === 'init') {
    if (d.version && d.version > APP_VERSION && !versionMismatchSent) {
      versionMismatchSent = true;
      window.webxdc.sendUpdate({
        payload: { type: 'version_mismatch', appVersion: APP_VERSION, serverVersion: d.version, senderAddr: window.webxdc.selfAddr },
        summary: 'Update requested'
      }, 'Version mismatch');
      return;
    }
    // Request contacts list on init
    window.webxdc.sendUpdate({
      payload: { type: 'list_contacts', senderAddr: window.webxdc.selfAddr },
    }, '');
    showView('contacts');
    return;
  }

  if (d.type === 'contacts_loaded') {
    renderContactList(d.contacts || []);
    updateManagedAgentSubtitle(d.managedAgentName || null);
    return;
  }

  if (d.type === 'role_assigned') {
    if (d.contact) onRoleAssigned(d.contact);
    return;
  }

  if (d.type === 'role_assign_err') {
    onRoleAssignErr(d.contactId, d.message);
    return;
  }
}, 0);

// ── DOM ready ──────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // Shell is visible immediately (late-init: no blank state).
  // Views are hidden until an 'init' payload arrives.
});
</script>
</body>
