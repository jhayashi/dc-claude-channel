<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="webxdc.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0e1117;
  color: #e6edf3;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  touch-action: pan-y;
}
.loading {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8b949e;
  font-size: 16px;
}
.header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header-title {
  font-size: 15px;
  font-weight: 600;
  color: #e6edf3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.slide-counter {
  font-size: 13px;
  color: #8b949e;
  margin-left: 12px;
  white-space: nowrap;
}
.slide-area {
  flex: 1;
  display: flex;
  align-items: stretch;
  overflow: hidden;
  position: relative;
}
.slide-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  -webkit-overflow-scrolling: touch;
}
/* Markdown rendering */
.slide-content h1 { font-size: 28px; font-weight: 700; margin: 0 0 16px; color: #f0f6fc; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
.slide-content h2 { font-size: 22px; font-weight: 600; margin: 20px 0 12px; color: #e6edf3; }
.slide-content h3 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; color: #e6edf3; }
.slide-content h4 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; color: #e6edf3; }
.slide-content p { margin: 0 0 12px; line-height: 1.6; }
.slide-content ul, .slide-content ol { margin: 0 0 12px; padding-left: 24px; }
.slide-content li { margin: 4px 0; line-height: 1.6; }
.slide-content li input[type="checkbox"] { margin-right: 6px; }
.slide-content blockquote {
  border-left: 3px solid #3b82f6;
  padding: 8px 16px;
  margin: 0 0 12px;
  color: #8b949e;
  background: #161b22;
  border-radius: 0 6px 6px 0;
}
.slide-content pre {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 6px;
  padding: 12px 16px;
  overflow-x: auto;
  margin: 0 0 12px;
  font-size: 13px;
  line-height: 1.5;
}
.slide-content code {
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 0.9em;
}
.slide-content :not(pre) > code {
  background: #21262d;
  padding: 2px 6px;
  border-radius: 4px;
  color: #79c0ff;
}
.slide-content table {
  border-collapse: collapse;
  width: 100%;
  margin: 0 0 12px;
}
.slide-content th, .slide-content td {
  border: 1px solid #30363d;
  padding: 8px 12px;
  text-align: left;
}
.slide-content th { background: #161b22; font-weight: 600; }
.slide-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 8px 0; }
.slide-content a { color: #58a6ff; text-decoration: underline; text-decoration-color: #58a6ff40; text-underline-offset: 2px; }
.slide-content a:hover { text-decoration-color: #58a6ff; }
.slide-content strong { font-weight: 600; }
.slide-content em { font-style: italic; }
.slide-content del { text-decoration: line-through; color: #8b949e; }
.slide-content hr { border: none; border-top: 1px solid #30363d; margin: 16px 0; }
/* Navigation */
.nav-bar {
  background: #161b22;
  border-top: 1px solid #30363d;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
}
.nav-btn {
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 8px;
  color: #e6edf3;
  padding: 8px 18px;
  font-size: 14px;
  cursor: pointer;
  min-width: 80px;
  text-align: center;
}
.nav-btn:active { background: #30363d; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.dots {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  flex: 1;
  flex-wrap: wrap;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #30363d;
  transition: background 0.2s;
}
.dot.active { background: #58a6ff; }
</style>
</head>
<body>
<div class="loading" id="loading">Waiting for slides&hellip;</div>
<div id="viewer" style="display:none;flex:1;display:none;flex-direction:column;">
  <div class="header">
    <span class="header-title" id="title"></span>
    <span class="slide-counter" id="counter"></span>
  </div>
  <div class="slide-area" id="slideArea">
    <div class="slide-content" id="slideContent"></div>
  </div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn">&#9664; Prev</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn">Next &#9654;</button>
  </div>
</div>
<script>
(function() {
  var APP_VERSION = 1.00;
  var slides = [];
  var currentSlide = 0;
  var deckTitle = '';

  // --- Markdown renderer (subset) ---
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderInline(text) {
    // images
    text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, src) {
      return '<img src="' + esc(src) + '" alt="' + esc(alt) + '">';
    });
    // links
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, t, url) {
      return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(t) + '</a>';
    });
    // bold+italic
    text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    // bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // strikethrough
    text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
    // inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    return text;
  }

  function renderMarkdown(md) {
    var lines = md.split('\n');
    var html = '';
    var i = 0;
    var inCodeBlock = false;
    var codeContent = '';
    var inTable = false;
    var tableRows = [];

    function flushTable() {
      if (!inTable) return;
      inTable = false;
      html += '<table>';
      for (var r = 0; r < tableRows.length; r++) {
        if (r === 1 && /^[\s|:-]+$/.test(tableRows[r])) continue; // separator
        var cells = tableRows[r].split('|').filter(function(c, idx, arr) {
          return idx > 0 && idx < arr.length - 1;
        });
        var tag = r === 0 ? 'th' : 'td';
        html += '<tr>';
        for (var c = 0; c < cells.length; c++) {
          html += '<' + tag + '>' + renderInline(cells[c].trim()) + '</' + tag + '>';
        }
        html += '</tr>';
      }
      html += '</table>';
      tableRows = [];
    }

    while (i < lines.length) {
      var line = lines[i];

      // Code blocks
      if (/^```/.test(line)) {
        if (inCodeBlock) {
          html += '<pre><code>' + esc(codeContent) + '</code></pre>';
          codeContent = '';
          inCodeBlock = false;
          i++;
          continue;
        }
        inCodeBlock = true;
        codeContent = '';
        i++;
        continue;
      }
      if (inCodeBlock) {
        codeContent += (codeContent ? '\n' : '') + line;
        i++;
        continue;
      }

      // Tables
      if (/^\|/.test(line)) {
        if (!inTable) inTable = true;
        tableRows.push(line);
        i++;
        continue;
      }
      flushTable();

      // Headings
      var hm = line.match(/^(#{1,4})\s+(.+)/);
      if (hm) {
        var level = hm[1].length;
        html += '<h' + level + '>' + renderInline(hm[2]) + '</h' + level + '>';
        i++;
        continue;
      }

      // Horizontal rule
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        html += '<hr>';
        i++;
        continue;
      }

      // Blockquote
      if (/^>\s?/.test(line)) {
        var bq = '';
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          bq += (bq ? '\n' : '') + lines[i].replace(/^>\s?/, '');
          i++;
        }
        html += '<blockquote>' + renderInline(bq) + '</blockquote>';
        continue;
      }

      // Unordered list
      if (/^[\s]*[-*+]\s/.test(line)) {
        html += '<ul>';
        while (i < lines.length && /^[\s]*[-*+]\s/.test(lines[i])) {
          var li = lines[i].replace(/^[\s]*[-*+]\s/, '');
          // Task list
          if (/^\[[ x]\]\s/.test(li)) {
            var checked = li[1] === 'x';
            li = li.slice(4);
            html += '<li><input type="checkbox" disabled' + (checked ? ' checked' : '') + '>' + renderInline(li) + '</li>';
          } else {
            html += '<li>' + renderInline(li) + '</li>';
          }
          i++;
        }
        html += '</ul>';
        continue;
      }

      // Ordered list
      if (/^\d+\.\s/.test(line)) {
        html += '<ol>';
        while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
          html += '<li>' + renderInline(lines[i].replace(/^\d+\.\s/, '')) + '</li>';
          i++;
        }
        html += '</ol>';
        continue;
      }

      // Empty line
      if (/^\s*$/.test(line)) {
        i++;
        continue;
      }

      // Paragraph
      var para = '';
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i]) && !/^```/.test(lines[i]) && !/^\|/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^[\s]*[-*+]\s/.test(lines[i]) && !/^\d+\.\s/.test(lines[i]) && !/^(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
        para += (para ? ' ' : '') + lines[i];
        i++;
      }
      html += '<p>' + renderInline(para) + '</p>';
    }

    flushTable();
    if (inCodeBlock) {
      html += '<pre><code>' + esc(codeContent) + '</code></pre>';
    }
    return html;
  }

  // --- Marp parser ---
  function parseMarp(content) {
    var text = content;
    var title = '';

    // Strip YAML frontmatter
    if (/^---\s*\n/.test(text)) {
      var end = text.indexOf('\n---', 3);
      if (end !== -1) {
        var frontmatter = text.slice(4, end);
        // Extract title from frontmatter
        var tm = frontmatter.match(/(?:^|\n)title\s*:\s*(.+)/);
        if (tm) title = tm[1].trim().replace(/^["']|["']$/g, '');
        text = text.slice(end + 4).replace(/^\n+/, '');
      }
    }

    // Split on --- separators (must be on their own line)
    var rawSlides = text.split(/\n---\s*\n/);
    var parsed = [];
    for (var s = 0; s < rawSlides.length; s++) {
      var content = rawSlides[s].trim();
      if (content) parsed.push(content);
    }

    // If no title from frontmatter, use first heading
    if (!title && parsed.length > 0) {
      var hm = parsed[0].match(/^#\s+(.+)/m);
      if (hm) title = hm[1];
    }

    return { title: title, slides: parsed };
  }

  // --- UI ---
  function showSlide(index) {
    if (index < 0 || index >= slides.length) return;
    currentSlide = index;
    document.getElementById('slideContent').innerHTML = renderMarkdown(slides[index]);
    document.getElementById('slideContent').scrollTop = 0;
    updateNav();
  }

  function updateNav() {
    document.getElementById('counter').textContent = (currentSlide + 1) + ' / ' + slides.length;
    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;

    var dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = '';
    // Show dots for up to 20 slides
    if (slides.length <= 20) {
      for (var d = 0; d < slides.length; d++) {
        var dot = document.createElement('span');
        dot.className = 'dot' + (d === currentSlide ? ' active' : '');
        (function(idx) { dot.onclick = function() { showSlide(idx); }; })(d);
        dotsEl.appendChild(dot);
      }
    }
  }

  function prevSlide() { showSlide(currentSlide - 1); }
  function nextSlide() { showSlide(currentSlide + 1); }

  document.getElementById('prevBtn').onclick = prevSlide;
  document.getElementById('nextBtn').onclick = nextSlide;

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { prevSlide(); e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { nextSlide(); e.preventDefault(); }
  });

  // Swipe navigation
  var touchStartX = 0;
  var touchStartY = 0;
  var slideArea = document.getElementById('slideArea');
  slideArea.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  slideArea.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextSlide(); else prevSlide();
    }
  }, { passive: true });

  // --- WebXDC listener ---
  function loadDeck(data) {
    var parsed = parseMarp(data.content || '');
    slides = parsed.slides;
    deckTitle = data.title || parsed.title || 'Slides';
    currentSlide = 0;

    document.getElementById('loading').style.display = 'none';
    var viewer = document.getElementById('viewer');
    viewer.style.display = 'flex';
    viewer.style.flexDirection = 'column';
    document.getElementById('title').textContent = deckTitle;
    showSlide(0);
  }

  window.webxdc.setUpdateListener(function(update) {
    var p = update.payload;
    if (!p) return;

    // Version mismatch check
    if (p.version && p.version > APP_VERSION) {
      window.webxdc.sendUpdate({
        payload: { type: 'version_mismatch', senderAddr: window.webxdc.selfAddr }
      }, 'version mismatch');
      document.getElementById('loading').textContent = 'Updating app\u2026';
      return;
    }

    if (p.type === 'slides') {
      loadDeck(p);
    }
  }, 0);
})();
</script>
</body>
</html>
