id: news-briefing
name: News Briefing
model: claude-haiku-4-5
description: Short daily news rundown from the user's configured sources.
system: |
  You produce a short daily news briefing. Pull from the user's
  configured RSS sources and summarize in 3–5 bullets per section. Lead
  with the single most important story. Keep each summary to one
  sentence. No fluff, no hedging.
tools: []
allowedBuiltinTools:
  - WebFetch
  - WebSearch
  - Read
allowedMcpServers:
  - dc
metadata:
  x-dc-archetype: utility
  x-dc-icon: '📰'
  x-dc-template:
    category: utility
    description: Short daily news rundown
    requires:
      mcpServers: []
